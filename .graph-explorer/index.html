ackups stopped weeks ago and nobody noticed\u003c/td>\u003ctd>Alert when an expected success does not arrive\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The last row needs a specific control. An alert on failure cannot fire for a job that never started, so have each successful run send a heartbeat and alert when one is missing.\u003c/p>\u003cp>Write the job so that running it twice is harmless, for example by recording which billing period has been processed. Keep the cron entry small: for large tasks, have it enqueue a \u003ca href=\"#Background%20job\" data-term=\"Background job\">background job\u003c/a> on a \u003ca href=\"#Job%20queue\" data-term=\"Job queue\">job queue\u003c/a>, which provides retries and visibility.\u003c/p>","avoid":"","usage":["Customers got three copies of the monthly invoice.","The cron job runs on every instance, and we scaled to three. Move it to a single scheduler and make it idempotent."],"out":[44,45]},{"name":"Graceful shutdown","section":4,"description":"Stopping a server by refusing new work, finishing what is in flight and closing resources before the process exits.","body":"\u003cp>Graceful shutdown is stopping a process in an orderly way: it refuses new work, finishes what is in progress, closes its resources and exits. Without it, each deploy kills in-flight requests, which appears as a burst of 502 errors at every release.\u003c/p>\u003cp>Platforms normally signal a process with \u003ccode>SIGTERM\u003c/code>, wait for a grace period, then force it to stop with \u003ccode>SIGKILL\u003c/code>, which cannot be caught. Kubernetes, for example, waits 30 seconds by default. A server should then:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Process\u003c/td>\u003ctd>Receives \u003ccode>SIGTERM\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Process\u003c/td>\u003ctd>Fails its readiness check so traffic stops arriving\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Process\u003c/td>\u003ctd>Waits briefly, because routing updates are not instant\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Process\u003c/td>\u003ctd>Stops accepting connections and closes idle \u003ca href=\"#Keep-alive\" data-term=\"Keep-alive\">keep-alive\u003c/a> ones\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Process\u003c/td>\u003ctd>Lets in-flight requests finish, up to a deadline\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Process\u003c/td>\u003ctd>Closes database pools and flushes logs and metrics\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>Process\u003c/td>\u003ctd>Exits before the grace period ends\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Step 3 is often missed. If the server closes its listener immediately, the load balancer (the component spreading traffic across instances) can still route requests to it for a few seconds, and those requests fail.\u003c/p>\u003cp>A \u003ca href=\"#WebSocket\" data-term=\"WebSocket\">WebSocket\u003c/a> or \u003ca href=\"#Server-Sent%20Events\" data-term=\"Server-Sent Events\">Server-Sent Events\u003c/a> stream never finishes alone, so the server must close it and rely on clients reconnecting with random delay.\u003c/p>\u003cp>A \u003ca href=\"#Worker\" data-term=\"Worker\">worker\u003c/a> stops reserving jobs, then finishes the current job or returns it to the \u003ca href=\"#Job%20queue\" data-term=\"Job queue\">job queue\u003c/a>. If a job runs longer than the grace period, it will be killed, so it must be safe to retry.\u003c/p>\u003cp>A common container bug blocks this. If the image starts the app through a shell, as in \u003ccode>CMD node server.js\u003c/code>, the shell may receive \u003ccode>SIGTERM\u003c/code> and not forward it. The app is then killed at the deadline. Use the exec form, \u003ccode>CMD [&quot;node&quot;, &quot;server.js&quot;]\u003c/code>.\u003c/p>","avoid":"","usage":["We get a spike of 502s on every deploy.","The app has no graceful shutdown. Handle \u003ccode>SIGTERM\u003c/code>, fail readiness, then drain before exiting."],"out":[5,7,8,46,45]},{"name":"Layered architecture","section":5,"description":"Organising an application into horizontal layers, such as API, service and data access, where each depends on the one below.","body":"\u003cp>Layered architecture is a way of organising an application into horizontal layers, each with one kind of responsibility. Code in a layer calls the layer beneath it and knows nothing about the layers above. It is the default structure of many web frameworks.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Layer\u003c/th>\u003cth>Responsibility\u003c/th>\u003cth>Typical contents\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Presentation\u003c/td>\u003ctd>Handle \u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a>, parse input, format output\u003c/td>\u003ctd>Controllers, \u003ca href=\"#DTO\" data-term=\"DTO\">DTOs\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application\u003c/td>\u003ctd>Coordinate a use case and its transaction\u003c/td>\u003ctd>Services\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Domain\u003c/td>\u003ctd>Hold business rules\u003c/td>\u003ctd>Entities, calculations\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Data access\u003c/td>\u003ctd>Read and write storage\u003c/td>\u003ctd>\u003ca href=\"#Repository%20pattern\" data-term=\"Repository pattern\">Repositories\u003c/a>, \u003ca href=\"#ORM\" data-term=\"ORM\">ORM\u003c/a> models\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The purpose is to separate reasons for change. A new response format should affect the presentation layer, and a query optimization should affect data access. The structure also gives a team a shared answer to &quot;where does this code go?&quot;\u003c/p>\u003cp>Layering breaks down in recognisable ways. SQL appears in a controller, so the same rule gets reimplemented in three endpoints with slight differences. Business logic lands in controllers, so a \u003ca href=\"#Background%20job\" data-term=\"Background job\">background job\u003c/a> that needs the same rule has to copy it, because it has no HTTP request to pass through. Keeping rules below the presentation layer lets every entry point reuse them.\u003c/p>\u003cp>The opposite failure is ceremony. A service method that only calls a repository method, which only calls the ORM, adds files without adding behaviour. Adding one field then means editing every layer. For a small CRUD service (one that mainly creates, reads, updates and deletes records), fewer layers are reasonable.\u003c/p>\u003cp>A further limitation is the direction of dependencies. In the traditional form, business logic depends on the data layer, so database details can leak upward and the rules are hard to test alone. \u003ca href=\"#Hexagonal%20architecture\" data-term=\"Hexagonal architecture\">Hexagonal architecture\u003c/a> inverts that dependency using interfaces and \u003ca href=\"#Dependency%20injection\" data-term=\"Dependency injection\">dependency injection\u003c/a>.\u003c/p>","avoid":"","usage":["Where should the discount calculation go? It's in the controller right now.","Move it down. In our layered architecture, the \u003ca href=\"#Worker\" data-term=\"Worker\">worker\u003c/a> and the API should both call the same domain code."],"out":[0,53,52,54,44,50,51,46]},{"name":"Hexagonal architecture","section":5,"description":"Structuring an app so business logic sits at the centre and reaches databases, APIs and UIs only through interfaces called ports.","body":"\u003cp>Hexagonal architecture, also called ports and adapters, is a structure that keeps business logic independent of technical details. Alistair Cockburn proposed it. The application sits at the centre and communicates with the outside world only through interfaces called ports. Adapters implement those ports for specific technologies.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Part\u003c/th>\u003cth>What it is\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Application\u003c/td>\u003ctd>Use cases and business rules\u003c/td>\u003ctd>\u003ccode>PlaceOrder\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Inbound port\u003c/td>\u003ctd>How the outside calls the application\u003c/td>\u003ctd>\u003ccode>PlaceOrder.execute(command)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Inbound adapter\u003c/td>\u003ctd>Translates an external trigger into a call\u003c/td>\u003ctd>\u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a> controller, queue consumer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Outbound port\u003c/td>\u003ctd>What the application needs from outside\u003c/td>\u003ctd>\u003ccode>PaymentGateway\u003c/code> interface\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Outbound adapter\u003c/td>\u003ctd>Implements that need with a technology\u003c/td>\u003ctd>Stripe client, Postgres \u003ca href=\"#Repository%20pattern\" data-term=\"Repository pattern\">repository\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The defining rule is that dependencies point inward. The application defines \u003ccode>PaymentGateway\u003c/code>, and the payment adapter implements it. This differs from traditional \u003ca href=\"#Layered%20architecture\" data-term=\"Layered architecture\">layered architecture\u003c/a>, where business code usually depends directly on the data layer. Adapters are connected at startup, normally through \u003ca href=\"#Dependency%20injection\" data-term=\"Dependency injection\">dependency injection\u003c/a>.\u003c/p>\u003cp>The structure addresses a familiar problem: business logic that cannot be tested without a running database and a sandbox payment account, or a vendor's SDK types spread across hundreds of files so that changing vendors becomes a rewrite. With ports, a \u003ca href=\"#Unit%20test\" data-term=\"Unit test\">unit test\u003c/a> can run a use case with a \u003ca href=\"#Test%20double\" data-term=\"Test double\">test double\u003c/a> for each outbound port. The same use case can be triggered by HTTP, a \u003ca href=\"#Cron%20job\" data-term=\"Cron job\">cron job\u003c/a> or a \u003ca href=\"#Worker\" data-term=\"Worker\">worker\u003c/a> by adding an adapter.\u003c/p>\u003cp>The cost is indirection. Each external interaction needs an interface, an adapter and mapping code, which is unnecessary for a thin CRUD application with few rules. A port that mirrors a vendor's API keeps the coupling it was supposed to remove, so define ports in terms of what the application needs. Adapters still need an \u003ca href=\"#Integration%20test\" data-term=\"Integration test\">integration test\u003c/a>, since test doubles cannot show that the real technology behaves as assumed.\u003c/p>","avoid":"","usage":["Replacing the payment provider means touching 200 files.","Because the SDK leaked everywhere. With hexagonal architecture, we'd only write a new adapter for the payment port."],"out":[0,52,49,51,57,60,47,46,58]},{"name":"Dependency injection","section":5,"description":"Passing an object the things it depends on from outside, instead of having it create or look them up itself.","body":"\u003cp>Dependency injection (DI) is passing a component the objects it needs from the outside, instead of having it create or look them up itself.\u003c/p>\u003cpre>\u003ccode>// Hard-wired: always uses the real client\nclass SignupService {\n  private mailer = new SmtpMailer(process.env.SMTP_URL);\n}\n\n// Injected: the caller decides which mailer to use\nclass SignupService {\n  constructor(private mailer: Mailer) {}\n}\u003c/code>\u003c/pre>\u003cp>The first version shows the usual symptom. To test signup you need a real mail server, or you must patch a module at runtime, and the test sends real email if configuration goes wrong. With injection, a \u003ca href=\"#Unit%20test\" data-term=\"Unit test\">unit test\u003c/a> passes a \u003ca href=\"#Test%20double\" data-term=\"Test double\">test double\u003c/a>, and production passes the real implementation. The class depends on an interface and on nothing else.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Form\u003c/th>\u003cth>How it is supplied\u003c/th>\u003cth>When to use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Constructor\u003c/td>\u003ctd>Argument when created\u003c/td>\u003ctd>Default choice, since nothing can be missing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Method\u003c/td>\u003ctd>Argument on each call\u003c/td>\u003ctd>The value varies per call\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Property\u003c/td>\u003ctd>Assigned after creation\u003c/td>\u003ctd>Optional dependencies, framework constraints\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Dependency injection does not require a framework. Wiring objects by hand in one startup location, called the composition root, is often enough. Containers such as those in Spring, NestJS and ASP.NET Core automate this wiring, which helps in large applications but can make it harder to trace where an object came from. Errors may also appear only at startup or at first use.\u003c/p>\u003cp>Containers introduce lifetime bugs. Objects can be created once per application or once per request. If a singleton captures a request-scoped object, it keeps the first request's data, and one user's context can appear in another user's response. Check that long-lived objects do not hold short-lived ones.\u003c/p>\u003cp>A constructor with ten parameters usually indicates a class doing too much, and DI has made that visible. DI is the mechanism that connects adapters to ports in \u003ca href=\"#Hexagonal%20architecture\" data-term=\"Hexagonal architecture\">hexagonal architecture\u003c/a>. Simple pure functions and value objects do not need it.\u003c/p>","avoid":"","usage":["I can't test this service without it sending a real email.","It builds its own mail client. Use dependency injection so the test can pass in a fake."],"out":[57,60,50]},{"name":"Repository pattern","section":5,"description":"Hiding data access behind a collection-like interface so business code asks for domain objects without knowing about queries.","body":"\u003cp>The repository pattern places data access behind an interface that resembles a collection of domain objects. Business code calls methods such as \u003ccode>orders.findById(id)\u003c/code> or \u003ccode>orders.save(order)\u003c/code> and does not need to know how the data is stored. The pattern was described in Martin Fowler's catalogue of enterprise patterns and is a building block of \u003ca href=\"#Domain-driven%20design\" data-term=\"Domain-driven design\">domain-driven design\u003c/a>.\u003c/p>\u003cpre>\u003ccode>interface OrderRepository {\n  findById(id: OrderId): Promise&lt;Order | null&gt;;\n  findOverdue(asOf: Date): Promise&lt;Order[]&gt;;\n  save(order: Order): Promise&lt;void&gt;;\n}\u003c/code>\u003c/pre>\u003cp>It addresses query logic scattered across a codebase. When the definition of an &quot;active customer&quot; appears in fifteen handwritten queries, a change to the rule leaves some of them behind, and reports begin to disagree. A named method such as \u003ccode>findActive()\u003c/code> puts the definition in one place. The interface also lets a \u003ca href=\"#Unit%20test\" data-term=\"Unit test\">unit test\u003c/a> use an in-memory \u003ca href=\"#Test%20double\" data-term=\"Test double\">test double\u003c/a>, and it serves as an outbound port in \u003ca href=\"#Hexagonal%20architecture\" data-term=\"Hexagonal architecture\">hexagonal architecture\u003c/a>.\u003c/p>\u003cp>The pattern is often misapplied:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Misuse\u003c/th>\u003cth>Result\u003c/th>\u003cth>Better approach\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Generic \u003ccode>Repository&lt;T&gt;\u003c/code> for all\u003c/td>\u003ctd>A thin wrapper repeating the \u003ca href=\"#ORM\" data-term=\"ORM\">ORM\u003c/a>\u003c/td>\u003ctd>Methods named for real queries\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Returning query builders\u003c/td>\u003ctd>Storage details leak to callers\u003c/td>\u003ctd>Return domain objects\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Loops calling \u003ccode>findById\u003c/code>\u003c/td>\u003ctd>One query per item, slow lists\u003c/td>\u003ctd>Add a batch method\u003c/td>\u003c/tr>\u003ctr>\u003ctd>One method per screen\u003c/td>\u003ctd>The interface grows without limit\u003c/td>\u003ctd>Use separate read queries\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Each repository commits alone\u003c/td>\u003ctd>A multi-step operation can half-succeed\u003c/td>\u003ctd>Manage the transaction at the use case\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Transactions need attention. If \u003ccode>orders.save()\u003c/code> and \u003ccode>inventory.save()\u003c/code> commit separately, a failure between them leaves inconsistent data. Have the application layer open one transaction, sometimes through a unit-of-work object, that both repositories join.\u003c/p>\u003cp>An in-memory fake will not reproduce real constraints, collation or locking, so test the actual repository with an \u003ca href=\"#Integration%20test\" data-term=\"Integration test\">integration test\u003c/a>. For small applications where an ORM already provides a clear interface, adding repositories may only add a layer.\u003c/p>","avoid":"","usage":["Finance and support are showing different counts of active customers.","Each has its own query. Put the rule in one repository method and use it in both."],"out":[55,57,60,50,54,58]},{"name":"DTO","section":5,"description":"A simple object that carries data across a boundary, keeping the API's shape separate from internal models.","body":"\u003cp>A DTO (data transfer object) is a simple object that carries data across a boundary, such as between an API and application code. It holds fields and has no business behaviour. Its purpose is to make the shape of data at the boundary explicit and independent from internal models.\u003c/p>\u003cp>Without a DTO, handlers often serialize the database model directly. This causes two well-known security failures:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Failure\u003c/th>\u003cth>What happens\u003c/th>\u003cth>DTO fix\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Data exposure\u003c/td>\u003ctd>A new \u003ccode>password_hash\u003c/code> or \u003ccode>internal_notes\u003c/code> column appears in API responses\u003c/td>\u003ctd>Response DTO lists allowed fields\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mass assignment\u003c/td>\u003ctd>A client adds \u003ccode>&quot;is_admin&quot;: true\u003c/code> to a profile update and it gets saved\u003c/td>\u003ctd>Request DTO omits that field\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Both happen quietly. Nobody edits the endpoint: someone adds a column, and the API starts returning it. An explicit allowlist of fields makes exposure a deliberate decision and supports field-level \u003ca href=\"#Authorization\" data-term=\"Authorization\">authorization\u003c/a>.\u003c/p>\u003cpre>\u003ccode>type CreateUserRequest = { email: string; name: string };\ntype UserResponse = { id: string; email: string; name: string };\u003c/code>\u003c/pre>\u003cp>Separate DTOs for requests and responses are normally clearer, because their fields differ. A client should not send an \u003ccode>id\u003c/code> or \u003ccode>createdAt\u003c/code>, while a response contains them.\u003c/p>\u003cp>DTOs also protect the public contract. If a response is tied to an \u003ca href=\"#ORM\" data-term=\"ORM\">ORM\u003c/a> entity, renaming a column becomes a \u003ca href=\"#Breaking%20change\" data-term=\"Breaking change\">breaking change\u003c/a> for API clients. With a DTO, you change the mapping and leave the API alone.\u003c/p>\u003cp>Validate request DTOs at the edge of the system. Check types, required fields and sizes before the data reaches business code, using a schema library where possible. Remember that a type annotation alone usually has no runtime effect, as with TypeScript types, so incoming JSON still needs validation.\u003c/p>\u003cp>The cost is mapping code and some repetition. For an internal tool with few fields, that can outweigh the benefit, but a public API usually justifies it.\u003c/p>","avoid":"","usage":["Why is \u003ccode>password_hash\u003c/code> in the user API response?","The controller returns the ORM entity directly. Add a response DTO that lists only the public fields."],"out":[22,54,18]},{"name":"ORM","section":5,"description":"A library that maps database tables to objects in code and generates SQL for reading and writing them.","body":"\u003cp>An ORM (object-relational mapper) is a library that maps database tables to classes and rows to objects, and generates the SQL to read and write them. Hibernate, Entity Framework, SQLAlchemy and Active Record are common examples. Instead of writing an \u003ccode>INSERT\u003c/code>, you create an object and save it.\u003c/p>\u003cp>An ORM removes repetitive query and mapping code, and its standard query methods use bound parameters, which protects them from \u003ca href=\"#SQL%20injection\" data-term=\"SQL injection\">SQL injection\u003c/a>. Many also track changes to loaded objects and write them in one transaction.\u003c/p>\u003cp>The trade-off is that database work becomes less visible. A line that looks like property access can run a query, and this leads to the failures most ORM users eventually meet:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Problem\u003c/th>\u003cth>Symptom\u003c/th>\u003cth>What to do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>N+1 queries\u003c/td>\u003ctd>A page of 50 orders runs 51 queries\u003c/td>\u003ctd>Eager-load the relation or batch it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Over-fetching\u003c/td>\u003ctd>A list loads large text columns it never shows\u003c/td>\u003ctd>Select only needed columns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lazy load after close\u003c/td>\u003ctd>Error when serializing outside the session\u003c/td>\u003ctd>Load data before leaving the transaction\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bulk updates\u003c/td>\u003ctd>Hooks and validations are skipped\u003c/td>\u003ctd>Know which APIs bypass model logic\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>N+1 usually passes in development with three rows, then becomes a slow endpoint in production. Turn on SQL logging locally, and consider a test that asserts the number of queries for important endpoints.\u003c/p>\u003cp>Use raw SQL when the ORM gets in the way, such as for reports, window functions or bulk changes. Mixing the two is normal. Raw queries must still use bound parameters.\u003c/p>\u003cp>Avoid passing ORM entities through the entire application. Exposing them from an API couples your contract to your table structure, which is what a \u003ca href=\"#DTO\" data-term=\"DTO\">DTO\u003c/a> prevents. A \u003ca href=\"#Repository%20pattern\" data-term=\"Repository pattern\">repository\u003c/a> can keep ORM details out of business logic.\u003c/p>","avoid":"","usage":["This endpoint is fine locally but takes four seconds in production.","Turn on query logging. I'd bet the ORM is lazy-loading the customer for each order."],"out":[32,53,52]},{"name":"Domain-driven design","section":5,"description":"An approach that shapes software around a model of the business, built with domain experts and using their language in code.","body":"\u003cp>Domain-driven design (DDD) is an approach to software that shapes code around a shared model of the business problem. Eric Evans introduced it in his 2003 book of the same name. Developers work with domain experts, such as accountants or logistics planners, so that the concepts in the code match how the business operates.\u003c/p>\u003cp>It targets a recognisable problem. The business says &quot;a policy lapses&quot;, the code says \u003ccode>status = 3\u003c/code>, and every requirement has to be translated in someone's head. DDD answers this with a ubiquitous language: an agreed vocabulary used in conversation, documents, class names and method names, such as \u003ccode>policy.lapse()\u003c/code>.\u003c/p>\u003cp>DDD has two levels. The strategic level divides a large domain into parts, each with a \u003ca href=\"#Bounded%20context\" data-term=\"Bounded context\">bounded context\u003c/a> in which terms have one precise meaning. The tactical level gives patterns for modelling inside a context:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Building block\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Entity\u003c/td>\u003ctd>Has an identity that persists as data changes\u003c/td>\u003ctd>\u003ccode>Order #42\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Value object\u003c/td>\u003ctd>Defined by its values, usually immutable\u003c/td>\u003ctd>\u003ccode>Money(10, &quot;EUR&quot;)\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Aggregate\u003c/td>\u003ctd>A cluster changed as a unit through one root\u003c/td>\u003ctd>\u003ccode>Order\u003c/code> and its lines\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Domain event\u003c/td>\u003ctd>A record of something that happened\u003c/td>\u003ctd>\u003ccode>OrderShipped\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Repository%20pattern\" data-term=\"Repository pattern\">Repository\u003c/a>\u003c/td>\u003ctd>Loads and saves aggregates\u003c/td>\u003ctd>\u003ccode>OrderRepository\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Aggregates protect business rules. If an order total must equal the sum of its lines, all changes go through the \u003ccode>Order\u003c/code> root, so no code can update one line and leave the total wrong.\u003c/p>\u003cp>DDD has a real cost and suits complex, long-lived business domains. A simple CRUD application gains little from aggregates and domain services. A common failure is adopting the tactical patterns without talking to domain experts, which adds classes without improving the model. It pairs well with \u003ca href=\"#Hexagonal%20architecture\" data-term=\"Hexagonal architecture\">hexagonal architecture\u003c/a>, which keeps the model free of infrastructure.\u003c/p>","avoid":"","usage":["The code calls it \u003ccode>status 3\u003c/code>, but operations calls it 'on hold pending review'.","Domain-driven design would have us use their term in the code, so we stop translating."],"out":[56,52,50]},{"name":"Bounded context","section":5,"description":"A boundary within which a domain model and its terms have one consistent meaning, even if other areas use the words differently.","body":"\u003cp>A bounded context is an explicit boundary inside which a model and its vocabulary have one consistent meaning. The term comes from \u003ca href=\"#Domain-driven%20design\" data-term=\"Domain-driven design\">domain-driven design\u003c/a>. It accepts that a large business does not have one universal model, because the same word means different things to different departments.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Context\u003c/th>\u003cth>What &quot;customer&quot; means\u003c/th>\u003cth>Fields it cares about\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Sales\u003c/td>\u003ctd>A lead or account being pursued\u003c/td>\u003ctd>Stage, owner, expected value\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Billing\u003c/td>\u003ctd>The party that pays invoices\u003c/td>\u003ctd>Tax ID, payment method, balance\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shipping\u003c/td>\u003ctd>A recipient at an address\u003c/td>\u003ctd>Address, delivery instructions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Support\u003c/td>\u003ctd>A person with open tickets\u003c/td>\u003ctd>Plan, ticket history\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Without boundaries, these meanings merge into a single model. The symptom is a \u003ccode>User\u003c/code> or \u003ccode>Customer\u003c/code> class with a hundred fields and many nullable columns, which every team edits and nobody fully understands. A billing change breaks shipping, and developers argue over what &quot;active&quot; means because each team is correct about its own area.\u003c/p>\u003cp>Inside each bounded context, the model contains only what that context needs. Billing has its own \u003ccode>Customer\u003c/code>, shipping has its own \u003ccode>Recipient\u003c/code>, and they relate through a shared identifier. Some duplication is intended, since it allows each model to change independently.\u003c/p>\u003cp>Contexts communicate through explicit contracts, such as an API, a \u003ca href=\"#Webhook\" data-term=\"Webhook\">webhook\u003c/a> or published events. When one integrates with a messy or external model, it can use an anti-corruption layer, code that translates the foreign model at the edge so its concepts do not leak inward. A \u003ca href=\"#DTO\" data-term=\"DTO\">DTO\u003c/a> often carries the data across this boundary.\u003c/p>\u003cp>A bounded context is a design boundary and does not have to be a separate service. It can be a module inside one deployable application, which is often a sensible starting point. Enforce it by not reaching into another context's tables or internal classes.\u003c/p>","avoid":"","usage":["Should we add \u003ccode>shipping_notes\u003c/code> to the main \u003ccode>Customer\u003c/code> model?","No, that belongs to the shipping bounded context. Keep it on \u003ccode>Recipient\u003c/code> and link by customer ID."],"out":[55,20,53]},{"name":"Unit test","section":6,"description":"A fast, isolated test of one small piece of behaviour, run without a network, real database or other external system.","body":"\u003cp>A unit test is an automated test that checks a small piece of behaviour in isolation. It runs in memory, with no network or real database, so a suite of thousands can finish in seconds and give feedback while you code. Teams disagree on the size of a &quot;unit&quot;: it may be one function, one class or a small group of collaborating objects.\u003c/p>\u003cpre>\u003ccode>def test_discount_is_capped_at_fifty_percent():\n    order = Order(subtotal=Money(100))        # arrange\n    order.apply_discount(percent=80)          # act\n    assert order.total == Money(50)           # assert\u003c/code>\u003c/pre>\u003cp>Unit tests suit logic with many cases: pricing, validation, parsing, date handling and state transitions. Boundary values such as zero, empty input, the maximum and the day of a leap year are cheap to cover here and expensive to cover any other way.\u003c/p>\u003cp>Good unit tests share a few properties:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Property\u003c/th>\u003cth>What it means\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Fast\u003c/td>\u003ctd>Milliseconds each, so people run them constantly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Deterministic\u003c/td>\u003ctd>Same result every run, with clock and randomness controlled\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Isolated\u003c/td>\u003ctd>No dependence on other tests or their order\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Behavioural\u003c/td>\u003ctd>Asserts outcomes, not internal steps\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Readable\u003c/td>\u003ctd>The name states the rule being protected\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The common failure is coupling tests to implementation. A test asserting that a private helper was called twice breaks when you refactor, even though the behaviour is unchanged. After enough false alarms, people stop trusting the suite and refactoring slows down. Overuse of a mocking \u003ca href=\"#Test%20double\" data-term=\"Test double\">test double\u003c/a> is the usual cause. Prefer checking return values and resulting state, and use doubles mainly for slow or external dependencies.\u003c/p>\u003cp>Unit tests cannot show that components work together. A query can be mocked successfully and still contain invalid SQL, which is what an \u003ca href=\"#Integration%20test\" data-term=\"Integration test\">integration test\u003c/a> is for. The \u003ca href=\"#Test%20pyramid\" data-term=\"Test pyramid\">test pyramid\u003c/a> describes how to balance these levels. Code that is difficult to unit test often has hard-wired dependencies, which \u003ca href=\"#Dependency%20injection\" data-term=\"Dependency injection\">dependency injection\u003c/a> can loosen.\u003c/p>","avoid":"","usage":["I renamed one private method and 40 unit tests failed.","They're asserting on internals. Rewrite them to check the output, so a refactor doesn't break them."],"out":[60,58,61,51]},{"name":"Integration test","section":6,"description":"A test that runs your code against real collaborators, such as a database, to check that the parts work together.","body":"\u003cp>An integration test checks that your code works correctly with a real collaborator, such as a database, message broker or another module. A \u003ca href=\"#Unit%20test\" data-term=\"Unit test\">unit test\u003c/a> replaces those dependencies, so it cannot catch a mistaken assumption about how they behave. Integration tests catch failures that appear at the join.\u003c/p>\u003cp>The familiar symptom is a green test suite followed by a production failure. The mocked \u003ca href=\"#Repository%20pattern\" data-term=\"Repository pattern\">repository\u003c/a> returned a row, but the real query had a typo. The code inserted a duplicate that the real unique constraint rejected. A timestamp lost precision, a migration was missing, or JSON serialized differently from what the test assumed.\u003c/p>\u003cp>Good targets include:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Target\u003c/th>\u003cth>What it can catch\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Repository and \u003ca href=\"#ORM\" data-term=\"ORM\">ORM\u003c/a> queries\u003c/td>\u003ctd>Invalid SQL, constraints, N+1, collation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a> route through \u003ca href=\"#Middleware\" data-term=\"Middleware\">middleware\u003c/a>\u003c/td>\u003ctd>Routing, \u003ca href=\"#Authentication\" data-term=\"Authentication\">authentication\u003c/a>, \u003ca href=\"#Status%20code\" data-term=\"Status code\">status codes\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Job%20queue\" data-term=\"Job queue\">Job queue\u003c/a> flows\u003c/td>\u003ctd>Serialization, retries, acknowledgement\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transaction behaviour\u003c/td>\u003ctd>Rollbacks and isolation between operations\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client for an external API\u003c/td>\u003ctd>Parsing, timeouts and error mapping, using a local stub server\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Use the same database engine as production. Running tests on SQLite while production uses PostgreSQL hides differences in types, locking and SQL dialect. Tools such as Testcontainers start a real database in a container, disposable per test run.\u003c/p>\u003cp>Isolation is the main practical challenge. Tests sharing a database can interfere and produce a \u003ca href=\"#Flaky%20test\" data-term=\"Flaky test\">flaky test\u003c/a> that only fails when run in a certain order or in parallel. Common solutions include wrapping each test in a transaction that rolls back, giving each test process its own schema, or generating unique data per test.\u003c/p>\u003cp>Integration tests are slower than unit tests, so keep them focused on the boundary and leave detailed business-rule permutations to faster tests. For a dependency owned by another team, a \u003ca href=\"#Contract%20test\" data-term=\"Contract test\">contract test\u003c/a> is often more practical than running their full system.\u003c/p>","avoid":"","usage":["All the tests pass, but the deploy fails on a unique constraint.","The repository is mocked everywhere. Add an integration test against a real Postgres container."],"out":[57,52,54,0,4,21,2,45,62,59]},{"name":"Contract test","section":6,"description":"A test verifying that an API provider and its consumer agree on request and response format, without running both together.","body":"\u003cp>A contract test verifies that two services agree on the format of their communication, without deploying them together. The contract records the requests a consumer sends and the responses it depends on. Each side then tests against that record independently.\u003c/p>\u003cp>It addresses a specific gap. Team A's tests mock Team B's API and pass. Team B's tests pass too. Then B renames a field, both pipelines stay green, and the failure appears only after deployment. Each side was testing against its own assumption. A contract test turns that mismatch into a failing build before the \u003ca href=\"#Breaking%20change\" data-term=\"Breaking change\">breaking change\u003c/a> ships.\u003c/p>\u003cp>In consumer-driven contract testing, the flow is as follows:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Consumer\u003c/td>\u003ctd>Writes a test declaring the request it sends and the fields it needs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Tool\u003c/td>\u003ctd>Runs that test against a mock and generates a contract file\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Consumer\u003c/td>\u003ctd>Publishes the contract to a shared location\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Provider\u003c/td>\u003ctd>Replays the contract against its real code in CI, the automated build\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Both\u003c/td>\u003ctd>Check compatibility before deploying\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Pact is a widely used tool for this approach. When every consumer publishes a contract, a provider can see which fields are unused.\u003c/p>\u003cp>An alternative is schema-based testing, where both sides are checked against a shared \u003ca href=\"#OpenAPI\" data-term=\"OpenAPI\">OpenAPI\u003c/a> document or \u003ca href=\"#Protocol%20Buffers\" data-term=\"Protocol Buffers\">Protocol Buffers\u003c/a> definition. This is simpler to adopt and suits public APIs with unknown consumers, but it shows only that a schema is compatible, and it says nothing about which fields clients rely on.\u003c/p>\u003cp>Contract tests check structure and agreed interactions. They do not verify business logic, so a response with the correct shape and a wrong price still passes. Keep those checks in the provider's \u003ca href=\"#Unit%20test\" data-term=\"Unit test\">unit tests\u003c/a> and \u003ca href=\"#Integration%20test\" data-term=\"Integration test\">integration tests\u003c/a>.\u003c/p>","avoid":"","usage":["Their deploy broke our checkout again, and both CI pipelines were green.","We're mocking their API from memory. Add a contract test so their build fails if they drop a field we use."],"out":[18,14,13,57,58]},{"name":"Test double","section":6,"description":"A stand-in for a real dependency during a test. Dummies, stubs, spies, mocks and fakes are the main kinds.","body":"\u003cp>A test double is an object that replaces a real dependency during a test, in the way a stunt double replaces an actor. Gerard Meszaros coined the term in his book \u003cem>xUnit Test Patterns\u003c/em>. Doubles let a \u003ca href=\"#Unit%20test\" data-term=\"Unit test\">unit test\u003c/a> avoid sending real email, charging a real card or waiting on a network, and they make hard-to-trigger cases, such as a timeout, easy to simulate.\u003c/p>\u003cp>&quot;Mock&quot; is commonly used for all of them, but there are five distinct kinds:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Kind\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Dummy\u003c/td>\u003ctd>Fills a parameter and is never used\u003c/td>\u003ctd>A placeholder logger\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stub\u003c/td>\u003ctd>Returns canned answers\u003c/td>\u003ctd>\u003ccode>getRate()\u003c/code> always returns \u003ccode>1.2\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Spy\u003c/td>\u003ctd>Records how it was called\u003c/td>\u003ctd>Captures emails &quot;sent&quot; for later checks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mock\u003c/td>\u003ctd>Is preprogrammed with expected calls and verifies them\u003c/td>\u003ctd>Fails unless \u003ccode>charge(100)\u003c/code> is called once\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fake\u003c/td>\u003ctd>Has a working but simplified implementation\u003c/td>\u003ctd>An in-memory \u003ca href=\"#Repository%20pattern\" data-term=\"Repository pattern\">repository\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Choosing the right kind affects how brittle a suite becomes. Stubs and fakes support checking outcomes. Mocks verify interactions, which fits cases where the call itself is the behaviour, such as &quot;the payment was charged exactly once&quot;. Using mocks for every collaborator ties tests to implementation, so a harmless refactor turns the suite red.\u003c/p>\u003cp>The larger risk is drift. A double encodes your belief about how the dependency behaves, and it keeps passing after the real one changes. The stub returns \u003ccode>{ &quot;amount&quot;: 100 }\u003c/code> while the real API now returns a string, so tests stay green and production fails. An \u003ca href=\"#Integration%20test\" data-term=\"Integration test\">integration test\u003c/a> or \u003ca href=\"#Contract%20test\" data-term=\"Contract test\">contract test\u003c/a> keeps those beliefs honest.\u003c/p>\u003cp>Double what you own, by wrapping a third-party SDK in a small interface of your own and replacing that interface. Inject doubles through \u003ca href=\"#Dependency%20injection\" data-term=\"Dependency injection\">dependency injection\u003c/a> instead of patching globals, which can leak between tests and cause a \u003ca href=\"#Flaky%20test\" data-term=\"Flaky test\">flaky test\u003c/a>.\u003c/p>","avoid":"","usage":["The payment test passes, but real charges are failing.","Our test double still returns the old response format. Add a contract test against the provider."],"out":[57,52,58,59,51,62]},{"name":"Test pyramid","section":6,"description":"A model for balancing a test suite, with many fast unit tests, fewer integration tests and a small number of end-to-end tests.","body":"\u003cp>The test pyramid is a model for deciding how many tests to write at each level. Mike Cohn popularised it. Its shape reflects cost: the base holds many fast, cheap tests, and each level above holds fewer, slower and more realistic ones.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Quantity\u003c/th>\u003cth>Speed\u003c/th>\u003cth>Confidence given\u003c/th>\u003cth>Failure points to\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>End-to-end\u003c/td>\u003ctd>Few\u003c/td>\u003ctd>Slow\u003c/td>\u003ctd>The full system works\u003c/td>\u003ctd>Anywhere\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Integration%20test\" data-term=\"Integration test\">Integration\u003c/a>\u003c/td>\u003ctd>Some\u003c/td>\u003ctd>Medium\u003c/td>\u003ctd>Components work together\u003c/td>\u003ctd>A specific boundary\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Unit%20test\" data-term=\"Unit test\">Unit\u003c/a>\u003c/td>\u003ctd>Many\u003c/td>\u003ctd>Fast\u003c/td>\u003ctd>Logic is correct\u003c/td>\u003ctd>A small area of code\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>An end-to-end test drives the deployed system as a user or client would. It catches wiring problems nothing else can, but it is slow, can fail for unrelated reasons, and a failure reveals little about the cause.\u003c/p>\u003cp>The usual rule is to test each behaviour at the lowest level that can catch its bug. Cover all discount permutations in unit tests. Use one integration test to show that the discount persists, and one end-to-end test to show that checkout works.\u003c/p>\u003cp>The recognisable anti-pattern is the inverted pyramid, or &quot;ice cream cone&quot;. Most coverage sits in browser or end-to-end tests. CI, the automated build, takes an hour, a \u003ca href=\"#Flaky%20test\" data-term=\"Flaky test\">flaky test\u003c/a> fails most runs, and developers rerun the pipeline until it passes or stop reading the results. When a test fails at the top and no lower test failed with it, consider adding the missing lower-level test.\u003c/p>\u003cp>The pyramid is a guideline and not a fixed ratio. A thin API over a database has little isolated logic, so integration tests may provide most of the value. That view is reflected in alternatives such as the &quot;testing trophy&quot;. A \u003ca href=\"#Contract%20test\" data-term=\"Contract test\">contract test\u003c/a> can replace many slow cross-service end-to-end tests.\u003c/p>","avoid":"","usage":["CI takes 70 minutes, and most of that is Selenium.","Our test pyramid is upside down. Keep a few critical journeys and push the rest down to API and unit tests."],"out":[58,57,62,59]},{"name":"Flaky test","section":6,"description":"A test that passes and fails on the same code with no change, usually because of timing, shared state or environment.","body":"\u003cp>A flaky test is a test that sometimes passes and sometimes fails on identical code. It often appears as a test that passes alone and fails in CI, the automated build, or a pipeline that goes green when someone presses &quot;re-run&quot;. The damage spreads beyond the single test: once people expect random failures, they start ignoring real ones.\u003c/p>\u003cp>Most flakiness has a small set of causes:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cause\u003c/th>\u003cth>Example\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Timing\u003c/td>\u003ctd>\u003ccode>sleep(1)\u003c/code> before checking a \u003ca href=\"#Background%20job\" data-term=\"Background job\">background job\u003c/a>\u003c/td>\u003ctd>Poll for the condition with a timeout\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Shared state\u003c/td>\u003ctd>Tests reuse one database row or global variable\u003c/td>\u003ctd>Isolate data per test\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Test order\u003c/td>\u003ctd>One test depends on another's leftovers\u003c/td>\u003ctd>Run in random order to expose it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Clock\u003c/td>\u003ctd>Fails at midnight, month-end or in another timezone\u003c/td>\u003ctd>Inject a fixed clock\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unordered results\u003c/td>\u003ctd>Asserting on a query with no \u003ccode>ORDER BY\u003c/code>\u003c/td>\u003ctd>Sort, or compare as a set\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Network\u003c/td>\u003ctd>Calls a real third-party sandbox\u003c/td>\u003ctd>Use a \u003ca href=\"#Test%20double\" data-term=\"Test double\">test double\u003c/a> or stub server\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Code bug\u003c/td>\u003ctd>A \u003ca href=\"#Race%20condition\" data-term=\"Race condition\">race condition\u003c/a> in the code\u003c/td>\u003ctd>Fix the production bug\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The last row is why flakiness should not be dismissed. A test failing once in fifty runs may be correctly detecting a race that also hits customers.\u003c/p>\u003cp>To reproduce one, run it in a loop, run the suite with the same order seed, and limit CPU to mimic CI.\u003c/p>\u003cp>Automatic retries keep a pipeline moving, but they also hide the problem. If you use them, record every test that passed only on retry. Quarantine a known flaky test by moving it out of the blocking suite, assign an owner and set a deadline.\u003c/p>\u003cp>\u003ca href=\"#Integration%20test\" data-term=\"Integration test\">Integration tests\u003c/a> and end-to-end tests are more prone to this, which is one reason the \u003ca href=\"#Test%20pyramid\" data-term=\"Test pyramid\">test pyramid\u003c/a> keeps them fewer.\u003c/p>","avoid":"","usage":["Just re-run it, that test always fails on Fridays.","That's a flaky test with a date bug. Inject the clock and fix it instead of re-running."],"out":[44,60,41,58,61]}]}
    </script>
    <script>
      (() => {
        const data = JSON.parse(
          document.getElementById("graph-data").textContent
        );
        const $ = (id) => document.getElementById(id);
        const stage = $("stage");
        const panel = $("panel");
        const panelBody = $("panel-body");
        const resizer = $("resizer");
        const search = $("search");
        const input = $("search-input");
        const results = $("results");
        const info = $("info");
        const infoBtn = $("info-btn");
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

        const INK = "#1c1c1a";
        const BG = "#ededE9";
        // Hubs keep their label even when it crosses another circle.
        const HUB_WEIGHT = 0.7;
        const esc = (s) =>
          s.replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
          );
        const hashFor = (name) => "#" + encodeURIComponent(name);

        const nodes = data.terms.map((term, i) => ({
          ...term,
          id: i,
          incoming: [],
        }));
        const links = [];
        const linkKeys = new Set();
        nodes.forEach((n) =>
          n.out.forEach((t) => {
            nodes[t].incoming.push(n.id);
            links.push({ source: n.id, target: t, from: n.id, to: t });
            linkKeys.add(n.id + ">" + t);
          })
        );
        // A two-way pair is drawn as one line; both directions keep their particles.
        links.forEach((l) => {
          l.hiddenTwin = l.from > l.to && linkKeys.has(l.to + ">" + l.from);
        });

        const maxIncoming = Math.max(...nodes.map((n) => n.incoming.length), 1);
        const sectionCount = data.sections.length;
        const stageBox = stage.getBoundingClientRect();
        const landscape = stageBox.width >= stageBox.height;
        const anchorRadiusX = landscape ? 360 : 170;
        const anchorRadiusY = landscape ? 190 : 320;
        nodes.forEach((n, i) => {
          const weight = Math.sqrt(n.incoming.length / maxIncoming);
          const shade = Math.round(214 - weight * 158);
          n.weight = weight;
          n.r = 4 + Math.sqrt(n.incoming.length) * 2.9;
          n.fill = `rgb(${shade},${shade},${shade - 3})`;
          n.neighbors = new Set([n.id, ...n.out, ...n.incoming]);
          const angle = (n.section / sectionCount) * Math.PI * 2;
          n.anchorX = sectionCount > 1 ? Math.cos(angle) * anchorRadiusX : 0;
          n.anchorY = sectionCount > 1 ? Math.sin(angle) * anchorRadiusY : 0;
          n.x = n.anchorX + Math.cos(i * 2.4) * (30 + i);
          n.y = n.anchorY + Math.sin(i * 2.4) * (30 + i);
        });
        const byName = new Map(nodes.map((n) => [n.name, n]));

        let selected = null;
        let hovered = null;
        let userMoved = false;
        let pauseTimer = 0;
        let particleFocus = null;
        // The selected term keeps the highlight; hovering only adds to it.
        const focusNode = () => selected || hovered;
        const isVisible = (n, f) =>
          !f || f.neighbors.has(n.id) || n === hovered;
        const endpoint = (v) => (typeof v === "object" ? v.id : v);
        const isFocusLink = (l) => {
          const f = focusNode();
          return (
            !!f && (endpoint(l.source) === f.id || endpoint(l.target) === f.id)
          );
        };

        function collideForce() {
          let all = [];
          const force = () => {
            for (let i = 0; i < all.length; i++) {
              for (let j = i + 1; j < all.length; j++) {
                const a = all[i],
                  b = all[j];
                const dx = b.x - a.x || 0.01,
                  dy = b.y - a.y || 0.01;
                const d = Math.hypot(dx, dy);
                const min = a.r + b.r + 9;
                if (d >= min) continue;
                const push = ((min - d) / d) * 0.5;
                b.x += dx * push;
                b.y += dy * push;
                a.x -= dx * push;
                a.y -= dy * push;
              }
            }
          };
          force.initialize = (n) => {
            all = n;
          };
          return force;
        }

        function sectionForce() {
          let all = [];
          const force = (alpha) =>
            all.forEach((n) => {
              n.vx += (n.anchorX - n.x) * 0.035 * alpha;
              n.vy += (n.anchorY - n.y) * 0.035 * alpha;
            });
          force.initialize = (n) => {
            all = n;
          };
          return force;
        }

        function drawNode(n, ctx, k) {
          const near = isVisible(n, focusNode());
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          if (!near) {
            // An opaque base stops lines showing through dimmed circles.
            ctx.fillStyle = BG;
            ctx.fill();
          }
          ctx.globalAlpha = near ? 1 : 0.15;
          ctx.fillStyle = n.fill;
          ctx.fill();
          ctx.globalAlpha = 1;
          if (n === selected) {
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r + 3.2 / Math.max(k, 0.6), 0, Math.PI * 2);
            ctx.strokeStyle = INK;
            ctx.lineWidth = 1.4 / k;
            ctx.stroke();
          }
        }

        function drawLabels(ctx, k) {
          const f = focusNode();
          const rank = (n) =>
            (n === hovered
              ? 4
              : n === f
                ? 3
                : f && f.neighbors.has(n.id)
                  ? 2
                  : 0) + n.weight;
          const placed = [];
          const order = nodes
            .filter((n) => isVisible(n, f))
            .sort((a, b) => rank(b) - rank(a));
          const hitsCircle = (box, self) =>
            order.some((m) => {
              if (m === self) return false;
              const cx = Math.max(box.l, Math.min(m.x, box.r));
              const cy = Math.max(box.t, Math.min(m.y, box.b));
              return Math.hypot(m.x - cx, m.y - cy) < m.r;
            });
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.lineJoin = "round";
          for (const n of order) {
            const pinned = n === f || n === hovered;
            const px = n === f ? 15 : n === hovered ? 13 : 8.5 + n.weight * 5.5;
            const size = px / k;
            ctx.font = `${size}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
            if ("letterSpacing" in ctx) ctx.letterSpacing = `${size * 0.06}px`;
            const text = n.name.toUpperCase();
            const w = ctx.measureText(text).width;
            const y = n.y - n.r - 5 / k;
            const box = {
              l: n.x - w / 2 - 3 / k,
              r: n.x + w / 2 + 3 / k,
              t: y - size - 1 / k,
              b: y + 1 / k,
            };
            if (
              !pinned &&
              ((n.weight < HUB_WEIGHT && hitsCircle(box, n)) ||
                placed.some(
                  (p) =>
                    box.l < p.r && box.r > p.l && box.t < p.b && box.b > p.t
                ))
            )
              continue;
            placed.push(box);
            ctx.globalAlpha = 0.9;
            ctx.strokeStyle = BG;
            ctx.lineWidth = 3.5 / k;
            ctx.strokeText(text, n.x, y);
            ctx.globalAlpha = pinned ? 1 : f ? 0.82 : 0.38 + n.weight * 0.55;
            ctx.fillStyle = INK;
            ctx.fillText(text, n.x, y);
          }
          ctx.globalAlpha = 1;
          if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
        }

        const graph = new ForceGraph($("graph"))
          .backgroundColor("rgba(0,0,0,0)")
          .nodeId("id")
          .nodeLabel(() => "")
          .nodeCanvasObject(drawNode)
          .nodePointerAreaPaint((n, color, ctx) => {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r + 2, 0, Math.PI * 2);
            ctx.fill();
          })
          .linkColor((l) => {
            if (l.hiddenTwin) return "rgba(0,0,0,0)";
            if (!focusNode()) return "rgba(28,28,26,.09)";
            return isFocusLink(l) ? "rgba(28,28,26,.5)" : "rgba(28,28,26,.025)";
          })
          .linkWidth((l) => (isFocusLink(l) ? 0.9 : 0.5))
          .linkDirectionalParticles((l) =>
            !reducedMotion.matches && isFocusLink(l) ? 2 : 0
          )
          .linkDirectionalParticleWidth(2.2)
          .linkDirectionalParticleSpeed(0.005)
          .linkDirectionalParticleColor(() => INK)
          .minZoom(0.25)
          .maxZoom(6)
          .warmupTicks(280)
          .cooldownTicks(70)
          .onRenderFramePost(drawLabels)
          .onNodeClick((n) => go(n.name))
          .onBackgroundClick(() => go(null))
          .onNodeHover((n) => {
            hovered = n || null;
            wake();
          })
          .onNodeDragEnd((n) => {
            n.fx = undefined;
            n.fy = undefined;
          })
          .onZoom((t) => {
            if (t && programmaticUntil < performance.now()) userMoved = true;
          });

        graph.d3Force("charge").strength(-340).distanceMax(760);
        graph
          .d3Force("link")
          .distance((l) => 46 + l.source.r + l.target.r)
          .strength(
            (l) =>
              0.55 / Math.min(l.source.neighbors.size, l.target.neighbors.size)
          );
        graph.d3Force("collide", collideForce());
        graph.d3Force("section", sectionForce());
        graph.graphData({ nodes, links });

        let programmaticUntil = 0;
        const camera = (ms) => {
          programmaticUntil = performance.now() + ms + 80;
        };

        function fitAll(ms = 0) {
          camera(ms);
          graph.zoomToFit(ms, 54);
        }

        function focusCamera(ms = 650) {
          if (!selected) return;
          const box = stage.getBoundingClientRect();
          let reach = selected.r;
          selected.neighbors.forEach((id) => {
            const m = nodes[id];
            reach = Math.max(
              reach,
              Math.hypot(m.x - selected.x, m.y - selected.y) + m.r
            );
          });
          const k = Math.min(
            2.2,
            Math.max(0.5, (Math.min(box.width, box.height) / 2 - 40) / reach)
          );
          camera(ms);
          graph.centerAt(selected.x, selected.y, ms);
          graph.zoom(k, ms);
        }

        function wake() {
          const f = focusNode();
          if (f !== particleFocus) {
            particleFocus = f;
            // force-graph only rebuilds particles when this prop is set.
            graph.linkDirectionalParticles((l) =>
              !reducedMotion.matches && isFocusLink(l) ? 2 : 0
            );
          }
          graph.autoPauseRedraw(false);
          clearTimeout(pauseTimer);
          if (!focusNode() || reducedMotion.matches) {
            pauseTimer = setTimeout(() => graph.autoPauseRedraw(true), 160);
          }
        }

        function renderPanel(n) {
          const chip = (id) =>
            `<a class="chip" href="${hashFor(nodes[id].name)}" data-term="${esc(nodes[id].name)}">${esc(nodes[id].name)}</a>`;
          const linkedFrom = n.incoming.filter((id) => !n.out.includes(id));
          panelBody.innerHTML = `
            <div class="eyebrow">${esc(data.sections[n.section])}</div>
            <h1 tabindex="-1">${esc(n.name)}</h1>
            ${n.description ? `<p class="lede">${esc(n.description)}</p>` : ""}
            ${n.usage.length ? `<section class="block"><span class="label">${esc(data.labels.quotes)}</span>
              <div class="bubbles">${n.usage.map((u) => `<div class="bubble">${u}</div>`).join("")}</div>
            </section>` : ""}
            ${n.avoid ? `<section class="block"><span class="label">${esc(data.labels.note)}</span><p class="avoid">${n.avoid}</p></section>` : ""}
            ${n.out.length ? `<section class="block"><span class="label">${esc(data.labels.outgoing)}</span><div class="chips">${n.out.map(chip).join("")}</div></section>` : ""}
            ${linkedFrom.length ? `<section class="block"><span class="label">${esc(data.labels.incoming)}</span><div class="chips">${linkedFrom.map(chip).join("")}</div></section>` : ""}
            ${n.body ? `<section class="block"><details><summary><span class="label">${esc(data.labels.body)}</span></summary><div class="entry">${n.body}</div></details></section>` : ""}`;
          panel.scrollTop = 0;
        }

        function applyHash({ moveFocus = false } = {}) {
          let name = "";
          try {
            name = decodeURIComponent(location.hash.slice(1));
          } catch {
            name = "";
          }
          selected = byName.get(name) || null;
          hovered = null;
          $("hint").hidden = !!selected;
          document.body.classList.toggle("has-selection", !!selected);
          document.title = selected
            ? `${selected.name} — ${data.title}`
            : `${data.title} — Graph`;
          if (selected) {
            renderPanel(selected);
            panel.hidden = false;
            if (moveFocus)
              panelBody.querySelector("h1").focus({ preventScroll: true });
          } else {
            panel.hidden = true;
          }
          resizer.hidden = !selected;
          syncResizer();
          resize();
          if (selected) focusCamera();
          else if (graphReady) {
            userMoved = false;
            fitAll(600);
          }
          wake();
        }

        function go(name) {
          closePopovers();
          const next = name ? hashFor(name) : "";
          if (location.hash === next) {
            if (name) focusCamera();
            return;
          }
          location.hash = next;
        }

        function resize() {
          const box = stage.getBoundingClientRect();
          graph.width(Math.round(box.width)).height(Math.round(box.height));
        }

        const PANEL_MIN = 300;
        const STAGE_MIN = 320;
        const PANEL_WIDTH_KEY = `graph-explorer:${data.title}:panel-width`;
        let preferredWidth = readPanelWidth();
        let resizing = false;
        let grabOffset = 0;

        function readPanelWidth() {
          try {
            const value = Number(localStorage.getItem(PANEL_WIDTH_KEY));
            return Number.isFinite(value) && value > 0 ? value : null;
          } catch {
            return null;
          }
        }

        function savePanelWidth() {
          try {
            if (preferredWidth === null)
              localStorage.removeItem(PANEL_WIDTH_KEY);
            else localStorage.setItem(PANEL_WIDTH_KEY, String(preferredWidth));
          } catch {
            // Storage can be unavailable; the width still applies this visit.
          }
        }

        const maxPanelWidth = () => Math.max(PANEL_MIN, innerWidth - STAGE_MIN);
        const clampPanelWidth = (width) =>
          Math.round(Math.min(maxPanelWidth(), Math.max(PANEL_MIN, width)));

        function syncResizer() {
          resizer.setAttribute("aria-valuemin", String(PANEL_MIN));
          resizer.setAttribute("aria-valuemax", String(maxPanelWidth()));
          if (!panel.hidden) {
            resizer.setAttribute(
              "aria-valuenow",
              String(Math.round(panel.getBoundingClientRect().width))
            );
          }
        }

        // The saved width is kept as-is so it returns when the window grows.
        function applyPanelWidth() {
          const root = document.documentElement;
          if (preferredWidth === null)
            root.style.removeProperty("--panel-width");
          else
            root.style.setProperty(
              "--panel-width",
              `${clampPanelWidth(preferredWidth)}px`
            );
          syncResizer();
        }

        function setPanelWidth(width) {
          preferredWidth = clampPanelWidth(width);
          applyPanelWidth();
        }

        function endResize() {
          if (!resizing) return;
          resizing = false;
          document.body.classList.remove("resizing");
          savePanelWidth();
          focusCamera(200);
        }

        resizer.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          resizer.setPointerCapture(e.pointerId);
          grabOffset = e.clientX - panel.getBoundingClientRect().left;
          resizing = true;
          document.body.classList.add("resizing");
        });
        resizer.addEventListener("pointermove", (e) => {
          if (!resizing) return;
          const right = $("app").getBoundingClientRect().right;
          setPanelWidth(right - (e.clientX - grabOffset));
        });
        resizer.addEventListener("pointerup", endResize);
        resizer.addEventListener("pointercancel", endResize);
        resizer.addEventListener("lostpointercapture", endResize);
        resizer.addEventListener("dblclick", () => {
          preferredWidth = null;
          applyPanelWidth();
          savePanelWidth();
        });
        resizer.addEventListener("keydown", (e) => {
          const step = e.shiftKey ? 64 : 24;
          const current = panel.getBoundingClientRect().width;
          const next = {
            ArrowLeft: current + step,
            ArrowRight: current - step,
            Home: PANEL_MIN,
            End: maxPanelWidth(),
          }[e.key];
          if (next === undefined) return;
          e.preventDefault();
          setPanelWidth(next);
          savePanelWidth();
        });
        window.addEventListener("resize", applyPanelWidth);
        applyPanelWidth();

        new ResizeObserver(() => {
          resize();
          if (selected) focusCamera(resizing ? 0 : 250);
          else if (graphReady && !userMoved) fitAll(0);
          wake();
        }).observe(stage);

        function closePopovers() {
          search.hidden = true;
          info.hidden = true;
          infoBtn.setAttribute("aria-expanded", "false");
        }

        let matches = [];
        let active = 0;

        function renderResults() {
          const q = input.value.trim().toLowerCase();
          const score = (n) => {
            const name = n.name.toLowerCase();
            if (!q) return 3;
            if (name === q) return 0;
            if (name.startsWith(q)) return 1;
            if (name.includes(q)) return 2;
            return n.description.toLowerCase().includes(q) ? 3 : 9;
          };
          matches = nodes
            .filter((n) => score(n) < 9)
            .sort(
              (a, b) => score(a) - score(b) || a.name.localeCompare(b.name)
            );
          active = Math.min(active, Math.max(matches.length - 1, 0));
          results.innerHTML = matches.length
            ? matches
                .map(
                  (n, i) =>
                    `<li id="result-${i}" role="option" aria-selected="${i === active}" data-name="${esc(n.name)}">${esc(n.name)}<small>${esc(n.description)}</small></li>`
                )
                .join("")
            : `<li class="none">No matching ${esc(data.nouns)}</li>`;
          if (matches.length) {
            input.setAttribute("aria-activedescendant", `result-${active}`);
            $(`result-${active}`).scrollIntoView({ block: "nearest" });
          } else input.removeAttribute("aria-activedescendant");
        }

        function openSearch() {
          info.hidden = true;
          infoBtn.setAttribute("aria-expanded", "false");
          search.hidden = false;
          input.value = "";
          active = 0;
          renderResults();
          input.focus();
        }

        function pick(name) {
          go(name);
          requestAnimationFrame(() => {
            const heading = panelBody.querySelector("h1");
            if (heading) heading.focus({ preventScroll: true });
          });
        }

        input.addEventListener("input", () => {
          active = 0;
          renderResults();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            if (!matches.length) return;
            active =
              (active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) %
              matches.length;
            renderResults();
          } else if (e.key === "Enter" && matches[active]) {
            e.preventDefault();
            pick(matches[active].name);
          }
        });
        results.addEventListener("mousedown", (e) => e.preventDefault());
        results.addEventListener("click", (e) => {
          const li = e.target.closest("li[data-name]");
          if (li) pick(li.dataset.name);
        });

        $("search-btn").addEventListener("click", () =>
          search.hidden ? openSearch() : closePopovers()
        );
        infoBtn.addEventListener("click", () => {
          const open = info.hidden;
          closePopovers();
          info.hidden = !open;
          infoBtn.setAttribute("aria-expanded", String(open));
        });
        $("close").addEventListener("click", () => go(null));
        $("info-counts").textContent =
          `${nodes.length} ${nodes.length === 1 ? data.noun : data.nouns}, ${links.length} ${links.length === 1 ? "link" : "links"}, ${data.sections.length} ${data.sections.length === 1 ? "group" : "groups"}.`;

        panel.addEventListener("mouseover", (e) => {
          const a = e.target.closest("[data-term]");
          const next = a ? byName.get(a.dataset.term) || null : null;
          if (next !== hovered) {
            hovered = next;
            wake();
          }
        });
        panel.addEventListener("mouseleave", () => {
          hovered = null;
          wake();
        });

        document.addEventListener("keydown", (e) => {
          const typing = /^(INPUT|TEXTAREA)$/.test(
            document.activeElement?.tagName || ""
          );
          if (
            (e.key === "/" && !typing) ||
            (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey))
          ) {
            e.preventDefault();
            openSearch();
          } else if (e.key === "Escape") {
            if (!search.hidden || !info.hidden) {
              const fromSearch = !search.hidden;
              closePopovers();
              if (fromSearch) $("search-btn").focus();
            } else if (selected) go(null);
          }
        });

        window.addEventListener("hashchange", () =>
          applyHash({ moveFocus: true })
        );

        let graphReady = false;
        resize();
        setTimeout(() => {
          graphReady = true;
          if (location.hash.length > 1) applyHash();
          else fitAll(0);
        }, 60);
      })();
    </script>
  </body>
</html>
