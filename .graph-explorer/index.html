<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dictionary of Backend Engineering — Graph</title>
    <style>
      :root {
        --bg: #edede9;
        --panel: #f5f5f1;
        --ink: #1c1c1a;
        --muted: #6d6d68;
        --line: #d4d4cf;
        --mono:
          ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.55 var(--sans);
        overflow: hidden;
      }
      a {
        color: inherit;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      #app {
        display: flex;
        height: 100dvh;
      }
      #stage {
        position: relative;
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }
      #graph {
        position: absolute;
        inset: 0;
      }

      .round {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        padding: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 50%;
        cursor: pointer;
      }
      .round:hover {
        border-color: var(--ink);
      }
      .round svg {
        width: 16px;
        height: 16px;
      }

      #top-left {
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #brand {
        font: 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #info-btn {
        position: absolute;
        top: 18px;
        right: 18px;
        z-index: 3;
        font-family: var(--mono);
        font-size: 13px;
      }
      #hint {
        position: absolute;
        bottom: 16px;
        left: 18px;
        z-index: 2;
        margin: 0;
        font: 12px var(--mono);
        color: var(--muted);
        pointer-events: none;
      }

      .popover {
        position: absolute;
        top: 66px;
        z-index: 4;
        width: min(360px, calc(100% - 36px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.1);
      }
      #search {
        left: 18px;
        overflow: hidden;
      }
      #search input {
        width: 100%;
        padding: 12px 14px;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line);
        font: 15px var(--sans);
        color: var(--ink);
        outline: none;
      }
      #results {
        max-height: min(55vh, 420px);
        margin: 0;
        padding: 4px;
        overflow-y: auto;
        list-style: none;
      }
      #results li {
        padding: 7px 10px;
        border-radius: 7px;
        cursor: pointer;
      }
      #results li[aria-selected="true"] {
        background: var(--ink);
        color: var(--panel);
      }
      #results small {
        display: block;
        overflow: hidden;
        font-size: 12px;
        opacity: 0.7;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #results .none {
        color: var(--muted);
        cursor: default;
      }
      #info {
        right: 18px;
        padding: 16px 18px;
        font-size: 14px;
      }
      #info h2 {
        margin: 0 0 6px;
        font: 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      #info p {
        margin: 0 0 8px;
      }
      #info p:last-child {
        margin-bottom: 0;
      }
      kbd {
        padding: 0 5px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font: 12px var(--mono);
      }

      #panel {
        position: relative;
        flex: 0 0 var(--panel-width, min(560px, 42vw));
        height: 100%;
        overflow-y: auto;
        background: var(--panel);
        border-left: 1px solid var(--line);
      }
      #resizer {
        position: relative;
        z-index: 5;
        flex: 0 0 11px;
        margin: 0 -6px 0 -5px;
        cursor: col-resize;
        touch-action: none;
      }
      #resizer::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 4px;
        width: 3px;
        background: transparent;
        transition: background 0.12s;
      }
      #resizer:hover::after,
      #resizer:focus-visible::after,
      .resizing #resizer::after {
        background: var(--ink);
      }
      #resizer:focus-visible {
        outline: none;
      }
      .resizing {
        cursor: col-resize;
        user-select: none;
      }
      #close {
        position: sticky;
        top: 16px;
        z-index: 2;
        float: right;
        margin: 16px 16px 0 0;
        font-size: 18px;
        line-height: 1;
      }
      #panel-body {
        padding: 30px 30px 44px;
      }
      .eyebrow,
      .label {
        font: 11px var(--mono);
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #panel h1 {
        margin: 6px 48px 12px 0;
        font-size: 26px;
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
        outline: none;
      }
      .lede {
        margin: 0;
        font-size: 16px;
      }
      .block {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .label {
        display: block;
        margin-bottom: 12px;
      }
      .bubbles {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .bubble {
        max-width: 88%;
        padding: 10px 14px;
        font-size: 14px;
        border-radius: 10px;
      }
      .bubble:nth-child(odd) {
        align-self: flex-start;
        background: #fbfbf8;
        border: 1px solid var(--line);
      }
      .bubble:nth-child(even) {
        align-self: flex-end;
        background: var(--ink);
        color: #f5f5f1;
      }
      .bubble code {
        background: rgb(127 127 127 / 0.22);
      }
      .avoid {
        margin: 0;
        font-size: 14px;
        color: #3b3b38;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .chip {
        padding: 3px 11px;
        font-size: 13px;
        text-decoration: none;
        background: transparent;
        border: 1px solid #a9a9a3;
        border-radius: 999px;
      }
      .chip:hover {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--panel);
      }
      details summary {
        cursor: pointer;
        list-style-position: inside;
      }
      details .label {
        display: inline;
        margin: 0;
      }
      .entry {
        margin-top: 12px;
        font-size: 14px;
      }
      .entry p,
      .entry ul,
      .entry ol,
      .entry blockquote,
      .entry pre,
      .entry .table {
        margin: 0 0 12px;
      }
      .entry ul,
      .entry ol {
        padding-left: 20px;
      }
      .entry h4 {
        margin: 16px 0 6px;
        font-size: 14px;
      }
      .entry blockquote {
        padding-left: 12px;
        border-left: 2px solid var(--line);
      }
      .entry .table {
        overflow-x: auto;
      }
      .entry table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .entry th,
      .entry td {
        padding: 6px 8px 6px 0;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
      }
      .entry pre {
        padding: 10px;
        overflow-x: auto;
        background: #e7e7e2;
        border-radius: 6px;
      }
      code {
        padding: 1px 4px;
        font: 0.9em var(--mono);
        background: #e7e7e2;
        border-radius: 4px;
      }
      pre code {
        padding: 0;
        background: none;
      }

      @media (max-width: 720px) {
        #app {
          flex-direction: column;
        }
        #panel {
          flex: 0 0 58dvh;
          width: 100%;
          height: 58dvh;
          border-top: 1px solid var(--line);
          border-left: 0;
        }
        #panel-body {
          padding: 22px 20px 36px;
        }
        #hint,
        #resizer,
        .has-selection #brand {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="stage">
        <div
          id="graph"
          role="img"
          aria-label="Force-directed graph of entries and the links between them. Use search to reach one by keyboard."
        ></div>
        <div id="top-left">
          <button
            id="search-btn"
            class="round"
            aria-label="Search entries"
            title="Search (/)"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.8-3.8" />
            </svg>
          </button>
          <span id="brand">Dictionary of Backend Engineering</span>
        </div>
        <button
          id="info-btn"
          class="round"
          aria-label="About this graph"
          aria-expanded="false"
          title="About"
        >
          i
        </button>
        <div id="search" class="popover" hidden>
          <input
            id="search-input"
            type="search"
            placeholder="Search entries"
            aria-label="Search entries"
            role="combobox"
            aria-expanded="true"
            aria-controls="results"
            autocomplete="off"
            spellcheck="false"
          />
          <ul id="results" role="listbox" aria-label="Matching entries"></ul>
        </div>
        <div id="info" class="popover" hidden>
          <h2>Reading the graph</h2>
          <p id="info-counts"></p>
          <p>
            Larger, darker circles are linked to by more entries. Dots on a line
            move in the direction of the link.
          </p>
          <p>
            Click a circle to read it. Drag to rearrange, scroll to zoom.
            <kbd>/</kbd> searches, <kbd>Esc</kbd> closes.
          </p>
        </div>
        <p id="hint">Click a circle, or press / to search</p>
      </main>
      <div
        id="resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize details panel"
        aria-controls="panel"
        tabindex="0"
        title="Drag to resize, double-click to reset"
        hidden
      ></div>
      <aside id="panel" aria-label="Term details" hidden>
        <button id="close" class="round" aria-label="Close details">×</button>
        <div id="panel-body"></div>
      </aside>
    </div>

    <script id="graph-data" type="application/json">
      {"title":"Dictionary of Backend Engineering","noun":"entry","nouns":"entries","labels":{"quotes":"Heard in the wild","note":"Note","outgoing":"Connects to","incoming":"Linked from","body":"Full entry"},"sections":["Requests and Protocols","API Design","Identity and Security","Concurrency","Background Work","Code Structure","Testing"],"terms":[{"name":"HTTP","section":0,"description":"The request-and-response protocol that clients and servers use to exchange data on the web and between backend services.","body":"\u003cp>HTTP (Hypertext Transfer Protocol) is the protocol a client and server use to exchange messages. The client sends a request containing an \u003ca href=\"#HTTP%20method\" data-term=\"HTTP method\">HTTP method\u003c/a>, a path, headers and an optional body. The server returns a response containing a \u003ca href=\"#Status%20code\" data-term=\"Status code\">status code\u003c/a>, headers and an optional body.\u003c/p>\u003cp>HTTP is stateless, which means the protocol keeps no memory of earlier requests. Each request must carry whatever the server needs to process it. Logged-in behaviour is built on top, usually by sending a \u003ca href=\"#Session%20cookie\" data-term=\"Session cookie\">session cookie\u003c/a> or a \u003ca href=\"#JWT\" data-term=\"JWT\">JWT\u003c/a> every time. This explains a common surprise: a call that works in the browser returns 401 when copied into a script, because the script did not send the credentials the browser was attaching.\u003c/p>\u003cp>The protocol has three versions in common use:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Version\u003c/th>\u003cth>Transport\u003c/th>\u003cth>How requests share a connection\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>HTTP/1.1\u003c/td>\u003ctd>TCP\u003c/td>\u003ctd>One response at a time, in order, so clients open several\u003c/td>\u003c/tr>\u003ctr>\u003ctd>HTTP/2\u003c/td>\u003ctd>TCP\u003c/td>\u003ctd>Many concurrent streams over one connection\u003c/td>\u003c/tr>\u003ctr>\u003ctd>HTTP/3\u003c/td>\u003ctd>QUIC over UDP\u003c/td>\u003ctd>Many streams, and a lost packet delays only its own stream\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Application code rarely changes between versions, because handlers see the same methods, headers and bodies. The differences show up in performance. On HTTP/2, one lost TCP packet delays every stream on that connection until it is retransmitted, which is the problem HTTP/3 was designed to remove.\u003c/p>\u003cp>Connections are normally encrypted with \u003ca href=\"#TLS\" data-term=\"TLS\">TLS\u003c/a> and reused through \u003ca href=\"#Keep-alive\" data-term=\"Keep-alive\">keep-alive\u003c/a>. HTTP defines the message format but not the design of your API. Conventions such as \u003ca href=\"#REST\" data-term=\"REST\">REST\u003c/a> sit on top of it, and \u003ca href=\"#gRPC\" data-term=\"gRPC\">gRPC\u003c/a> uses HTTP/2 as its transport.\u003c/p>","avoid":"","usage":["The endpoint works in Chrome but curl gets a 401.","HTTP is stateless, so curl knows nothing about your login. Copy the cookie header across and try again."],"out":[1,2,23,24,6,5,10,12]},{"name":"HTTP method","section":0,"description":"The verb on an HTTP request, such as GET or POST, stating what the client wants done and whether a retry is safe.","body":"\u003cp>An \u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a> method is the verb at the start of a request. It tells the server what kind of operation the client intends, and it tells every system in between, such as caches and proxies, how that request may be treated.\u003c/p>\u003cp>Two properties matter. A safe method does not ask the server to change anything. An idempotent method can be sent several times with the same intended effect as sending it once.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Method\u003c/th>\u003cth>Typical use\u003c/th>\u003cth>Safe\u003c/th>\u003cth>Idempotent\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>GET\u003c/td>\u003ctd>Read a resource\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>HEAD\u003c/td>\u003ctd>Read headers only\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OPTIONS\u003c/td>\u003ctd>Ask what is supported\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PUT\u003c/td>\u003ctd>Replace a resource\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DELETE\u003c/td>\u003ctd>Remove a resource\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>POST\u003c/td>\u003ctd>Create or trigger\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PATCH\u003c/td>\u003ctd>Partially update\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Not by default\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>These properties are promises your handler has to keep, because the protocol does not enforce them. A \u003ccode>GET /unsubscribe?id=42\u003c/code> link that changes data looks harmless until a link previewer, crawler or email scanner fetches it and unsubscribes the user with no click. State changes belong behind a non-safe method, which also supports \u003ca href=\"#CSRF\" data-term=\"CSRF\">CSRF\u003c/a> defences.\u003c/p>\u003cp>Idempotency decides what can be retried automatically. Clients and proxies may resend a GET or PUT after a dropped connection. Retrying a POST can create a second order or a second charge, because the client cannot tell whether the first attempt succeeded before the connection died. An \u003ca href=\"#Idempotency%20key\" data-term=\"Idempotency key\">idempotency key\u003c/a> makes such a POST safe to retry.\u003c/p>\u003cp>DELETE stays idempotent even if the second call returns 404, since idempotency describes the state of the server and not the response.\u003c/p>","avoid":"","usage":["Half our trial users got unsubscribed and none of them clicked anything.","The unsubscribe link is a GET, so the mail scanner triggered it. Make the link open a page and do the change with a POST."],"out":[0,31,19]},{"name":"Status code","section":0,"description":"The three-digit number in an HTTP response that tells the client whether the request worked and, if not, whose fault it was.","body":"\u003cp>A status code is the three-digit number at the start of an \u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a> response. It tells the client the outcome in a form software can act on, and the first digit gives the class.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Class\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Common examples\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1xx\u003c/td>\u003ctd>Informational\u003c/td>\u003ctd>101 Switching Protocols\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2xx\u003c/td>\u003ctd>Success\u003c/td>\u003ctd>200 OK, 201 Created, 202 Accepted, 204 No Content\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3xx\u003c/td>\u003ctd>Redirection\u003c/td>\u003ctd>301 Moved Permanently, 304 Not Modified, 307 Temporary Redirect\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4xx\u003c/td>\u003ctd>Client error\u003c/td>\u003ctd>400, 401, 403, 404, 409 Conflict, 422, 429 Too Many Requests\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5xx\u003c/td>\u003ctd>Server error\u003c/td>\u003ctd>500, 502 Bad Gateway, 503 Unavailable, 504 Gateway Timeout\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The class drives automated behaviour. Clients commonly retry 503 and other temporary failures, and they should not retry most 4xx responses, because the same request will fail the same way. Monitoring usually alerts on the 5xx rate. An API that returns \u003ccode>200 OK\u003c/code> with \u003ccode>{&quot;error&quot;: &quot;failed&quot;}\u003c/code> in the body hides failures from all of this: dashboards stay green while users see errors.\u003c/p>\u003cp>Some codes are often confused. 401 means the request lacks valid credentials, so it is an \u003ca href=\"#Authentication\" data-term=\"Authentication\">authentication\u003c/a> failure despite being named &quot;Unauthorized&quot;. 403 means the server knows who you are and refuses, which is an \u003ca href=\"#Authorization\" data-term=\"Authorization\">authorization\u003c/a> failure. Some APIs return 404 instead of 403 so they do not reveal that a private resource exists.\u003c/p>\u003cp>The 5xx codes also point to where a failure happened. 500 usually comes from your application. 502 and 504 usually come from a proxy in front of it, reporting a bad response or no response from the application. If logs show no error for a 502, check the proxy and the connection between it and the app, including \u003ca href=\"#Keep-alive\" data-term=\"Keep-alive\">keep-alive\u003c/a> timeouts.\u003c/p>","avoid":"","usage":["Error rate is flat but support says checkout is broken.","Checkout returns a 200 with an error in the body, so the alert never fires. Return a proper status code."],"out":[0,21,22,5]},{"name":"Request lifecycle","section":0,"description":"The ordered stages a request passes through on a server, from accepting the connection to sending the response and cleaning up.","body":"\u003cp>The request lifecycle is the sequence of stages an \u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a> request passes through inside a server. Knowing the sequence tells you where to add a check and where to look when a request is slow or fails.\u003c/p>\u003cp>A typical lifecycle in a web framework:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Proxy or server\u003c/td>\u003ctd>Accepts the connection and terminates \u003ca href=\"#TLS\" data-term=\"TLS\">TLS\u003c/a> if configured\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Server\u003c/td>\u003ctd>Parses the request line, headers and, when needed, the body\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Router\u003c/td>\u003ctd>Matches the method and path to a handler\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003ca href=\"#Middleware\" data-term=\"Middleware\">Middleware\u003c/a>\u003c/td>\u003ctd>Runs logging, \u003ca href=\"#Authentication\" data-term=\"Authentication\">authentication\u003c/a>, rate limits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Handler\u003c/td>\u003ctd>Validates input and calls application code\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Application code\u003c/td>\u003ctd>Reads and writes data, calls other services\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>Handler\u003c/td>\u003ctd>Builds the response and \u003ca href=\"#Status%20code\" data-term=\"Status code\">status code\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>Middleware\u003c/td>\u003ctd>Runs in reverse for response headers, logging and error mapping\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>Server\u003c/td>\u003ctd>Writes the response and keeps or closes the connection\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>When a request is slow, measure each stage instead of guessing. Time spent before the handler starts often means requests are queued, for example waiting for a free slot in a \u003ca href=\"#Thread%20pool\" data-term=\"Thread pool\">thread pool\u003c/a> or for a busy \u003ca href=\"#Event%20loop\" data-term=\"Event loop\">event loop\u003c/a>. That produces a confusing symptom: the handler's own timing looks fast while clients see long delays.\u003c/p>\u003cp>A client disconnect does not automatically stop the work. If the user closes the tab or a proxy times out, many frameworks keep running the handler, so a request reported as failed may still commit its database write. Pass a cancellation signal or deadline down through your calls where the framework supports it.\u003c/p>\u003cp>Work that does not need to finish before the response belongs in a \u003ca href=\"#Background%20job\" data-term=\"Background job\">background job\u003c/a>, which keeps this path short.\u003c/p>","avoid":"","usage":["The trace says the handler took 40 ms, but the client waited three seconds.","Then the time is earlier in the request lifecycle. Check whether requests are queueing before the handler starts."],"out":[0,6,4,21,2,37,38,44]},{"name":"Middleware","section":0,"description":"Code that wraps request handlers to apply shared behaviour such as logging, authentication and rate limiting, in a set order.","body":"\u003cp>Middleware is code that runs around a request handler and applies behaviour shared by many routes. Logging, \u003ca href=\"#Authentication\" data-term=\"Authentication\">authentication\u003c/a>, compression, rate limiting and error formatting are common examples. It occupies one stage of the \u003ca href=\"#Request%20lifecycle\" data-term=\"Request lifecycle\">request lifecycle\u003c/a>, so individual handlers do not each repeat the same logic.\u003c/p>\u003cp>Middleware forms a chain. Each function receives the request, may do some work, then either calls the next function or ends the request itself. When the inner function returns, control passes back outward, so the same middleware can act on both the request and the response:\u003c/p>\u003cpre>\u003ccode>logging -&gt; auth -&gt; rate limit -&gt; handler\nlogging &lt;- auth &lt;- rate limit &lt;- handler\u003c/code>\u003c/pre>\u003cp>Order changes behaviour, and most middleware bugs are ordering bugs:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Ordering mistake\u003c/th>\u003cth>What you observe\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Logging placed after auth\u003c/td>\u003ctd>Rejected requests never appear in the logs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error handler placed too far in\u003c/td>\u003ctd>Some exceptions return a default HTML 500 page\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Per-user rate limit before auth\u003c/td>\u003ctd>No user is known yet, so the limit cannot apply per user\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Body parser before a signature check\u003c/td>\u003ctd>A \u003ca href=\"#Webhook\" data-term=\"Webhook\">webhook\u003c/a> signature fails because the raw bytes are gone\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Auth registered after a route\u003c/td>\u003ctd>That route is reachable with no login\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The last row is a security failure that raises no error. In frameworks where registration order matters, a route defined before the auth middleware skips it. Prefer applying auth globally and marking the few public routes explicitly, so a new route is protected by default.\u003c/p>\u003cp>Keep middleware for cross-cutting concerns. Business rules placed here are hard to find and run on routes that do not need them. Slow middleware also adds its cost to every request that passes through it.\u003c/p>","avoid":"","usage":["Why is the admin export reachable without logging in?","That route is registered above the auth middleware, so it never runs. Move it below, or make auth global and allowlist public routes."],"out":[21,3,20]},{"name":"Keep-alive","section":0,"description":"Reusing one open connection for several HTTP requests, avoiding repeated setup. Mismatched idle timeouts cause intermittent 502s.","body":"\u003cp>Keep-alive is the practice of leaving a connection open after a response so the next request can reuse it. Opening a new connection costs a TCP handshake plus, on encrypted connections, a \u003ca href=\"#TLS\" data-term=\"TLS\">TLS\u003c/a> handshake. Reuse removes those round trips from every request after the first. In \u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a>/1.1, connections persist by default unless one side sends \u003ccode>Connection: close\u003c/code>, and HTTP/2 is built around one long-lived connection.\u003c/p>\u003cp>Either side may close an idle connection, and this creates a well-known failure. Suppose a proxy or load balancer (a server that spreads traffic across instances) keeps idle connections to your app for 60 seconds, while your app closes them after 5. The proxy can send a new request down a connection at the moment the app is closing it. The result is a small, irregular number of 502 errors or \u003ccode>ECONNRESET\u003c/code> messages, often with nothing in the application logs because the request never reached a handler.\u003c/p>\u003cp>The usual fix is to keep each server's idle timeout longer than its client's:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Hop\u003c/th>\u003cth>Idle timeout rule\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Proxy to app\u003c/td>\u003ctd>App must keep connections open longer than the proxy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>App to dependency\u003c/td>\u003ctd>Client pool should retire connections before the server closes them\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The same applies to outbound calls. An HTTP client with a connection pool can pick up a connection the remote server has already closed, so the request fails immediately. Good clients detect this and retry when it is safe, which depends on the \u003ca href=\"#HTTP%20method\" data-term=\"HTTP method\">HTTP method\u003c/a>.\u003c/p>\u003cp>Keep-alive here is different from TCP keepalive, an operating-system probe that checks whether an idle peer is reachable. Long-lived connections also complicate \u003ca href=\"#Graceful%20shutdown\" data-term=\"Graceful shutdown\">graceful shutdown\u003c/a>, since a server must close idle connections before it can exit.\u003c/p>","avoid":"","usage":["We get a handful of 502s an hour and the app logs show nothing.","Sounds like keep-alive. The app's idle timeout is shorter than the load balancer's, so raise it above the balancer's value."],"out":[6,0,1,48]},{"name":"TLS","section":0,"description":"The protocol that encrypts traffic and proves a server's identity using certificates. It is the S in HTTPS.","body":"\u003cp>TLS (Transport Layer Security) is the protocol that encrypts a connection and lets the client verify which server it is talking to. \u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a> sent over TLS is HTTPS. It provides confidentiality, so observers cannot read the traffic; integrity, so changes are detected; and server \u003ca href=\"#Authentication\" data-term=\"Authentication\">authentication\u003c/a> through a certificate.\u003c/p>\u003cp>A connection begins with a handshake:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Sends supported versions, cipher suites and key-agreement data\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Server\u003c/td>\u003ctd>Chooses parameters and sends its certificate chain\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Checks the chain, expiry date and that the hostname matches\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Both\u003c/td>\u003ctd>Derive shared session keys\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Both\u003c/td>\u003ctd>Encrypt application data with those keys\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>TLS 1.3 completes this in one round trip, and TLS 1.2 takes two. Use TLS 1.2 or later, since 1.0 and 1.1 are deprecated. \u003ca href=\"#Keep-alive\" data-term=\"Keep-alive\">Keep-alive\u003c/a> avoids repeating the handshake on every request.\u003c/p>\u003cp>Most TLS incidents are certificate problems. An expired certificate takes a service down for every client at once, so automate renewal and alert on the expiry date. A server that omits its intermediate certificate can work in a browser, which may already have it cached, and fail with \u003ccode>unable to verify\u003c/code> from a server-side client. A hostname mismatch fails when a service is called by an address the certificate does not list.\u003c/p>\u003cp>Do not fix these errors by disabling verification, such as \u003ccode>verify=False\u003c/code> or \u003ccode>NODE_TLS_REJECT_UNAUTHORIZED=0\u003c/code>. The traffic stays encrypted, but the client will accept an attacker's certificate. Install the correct CA certificate (the issuer's root of trust) instead.\u003c/p>\u003cp>TLS protects data only in transit and only between its two endpoints. If a proxy terminates TLS, the hop behind it is plaintext unless it is encrypted separately.\u003c/p>","avoid":"","usage":["The Python client throws a certificate error, but the site is fine in Chrome.","The server's probably missing its intermediate cert. Fix the chain and leave TLS verification on."],"out":[0,21,5]},{"name":"WebSocket","section":0,"description":"A long-lived, two-way connection between client and server, started from HTTP, for messages flowing in both directions.","body":"\u003cp>A WebSocket is a persistent connection over which client and server can each send messages at any time. It suits features where both sides talk frequently, such as chat, collaborative editing and multiplayer state.\u003c/p>\u003cp>The connection starts as an ordinary \u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a> request carrying an \u003ccode>Upgrade: websocket\u003c/code> header. The server answers with \u003ca href=\"#Status%20code\" data-term=\"Status code\">status code\u003c/a> \u003ccode>101 Switching Protocols\u003c/code>, and from then on the same connection carries WebSocket frames instead of HTTP messages. Use the encrypted \u003ccode>wss://\u003c/code> scheme, which runs over \u003ca href=\"#TLS\" data-term=\"TLS\">TLS\u003c/a>.\u003c/p>\u003cp>Long-lived connections change how a server behaves in production:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Problem\u003c/th>\u003cth>Symptom\u003c/th>\u003cth>What to do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Idle timeout at a proxy\u003c/td>\u003ctd>Sockets drop after a fixed quiet period\u003c/td>\u003ctd>Send ping/pong heartbeats\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Half-open connections\u003c/td>\u003ctd>Server keeps &quot;online&quot; users who have left\u003c/td>\u003ctd>Close sockets that miss heartbeats\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Deploys\u003c/td>\u003ctd>Every client disconnects at once\u003c/td>\u003ctd>Reconnect with random backoff, drain slowly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Several server instances\u003c/td>\u003ctd>A message misses users on another instance\u003c/td>\u003ctd>Publish through a shared message broker\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Slow consumers\u003c/td>\u003ctd>Server memory grows\u003c/td>\u003ctd>Limit buffers and disconnect slow clients\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Clients must assume the connection will drop, and must be able to catch up on anything missed after reconnecting. Without random delay, a deploy causes all clients to reconnect at the same instant.\u003c/p>\u003cp>Security needs specific attention. Browsers attach cookies to the handshake, and WebSockets are not restricted by the same-origin policy, so a malicious page can open a socket as the logged-in user. Validate the \u003ccode>Origin\u003c/code> header during the handshake, perform \u003ca href=\"#Authentication\" data-term=\"Authentication\">authentication\u003c/a> there, and check \u003ca href=\"#Authorization\" data-term=\"Authorization\">authorization\u003c/a> on each message.\u003c/p>\u003cp>If data flows only from server to client, \u003ca href=\"#Server-Sent%20Events\" data-term=\"Server-Sent Events\">Server-Sent Events\u003c/a> are simpler to run.\u003c/p>","avoid":"","usage":["Everyone's live cursor freezes after about a minute of inactivity.","The proxy is closing idle WebSocket connections. Add a heartbeat every 30 seconds and reconnect on close."],"out":[0,2,6,21,22,8]},{"name":"Server-Sent Events","section":0,"description":"A one-way stream of text events from server to client over a single long-lived HTTP response, with built-in browser reconnection.","body":"\u003cp>Server-Sent Events (SSE) is a standard for streaming messages from a server to a client over one long-running \u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a> response. The server replies with \u003ccode>Content-Type: text/event-stream\u003c/code>, leaves the response open and writes events as they happen:\u003c/p>\u003cpre>\u003ccode>id: 42\nevent: order-updated\ndata: {&quot;orderId&quot;: 7, &quot;status&quot;: &quot;shipped&quot;}\n\u003c/code>\u003c/pre>\u003cp>A blank line ends each event. In browsers, the built-in \u003ccode>EventSource\u003c/code> API parses the stream and reconnects automatically after a drop. On reconnect it sends the last ID it received in a \u003ccode>Last-Event-ID\u003c/code> header, so the server can replay what was missed if it has kept those events.\u003c/p>\u003cp>SSE fits notifications, progress bars, live dashboards and streamed text. Because it is plain HTTP, it works with existing \u003ca href=\"#Middleware\" data-term=\"Middleware\">middleware\u003c/a>, cookies and routing. Client-to-server messages travel as normal requests. When both directions are frequent, a \u003ca href=\"#WebSocket\" data-term=\"WebSocket\">WebSocket\u003c/a> is a better fit.\u003c/p>\u003cp>The most common problem is buffering. A proxy or compression layer may hold output until it has a full chunk, so events that were sent one at a time arrive in a late batch, or only when the stream ends. Disable buffering and compression for this route at each hop. With nginx, for example, the response header \u003ccode>X-Accel-Buffering: no\u003c/code> turns off proxy buffering.\u003c/p>\u003cp>Other limits to plan for:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Limit\u003c/th>\u003cth>Effect\u003c/th>\u003cth>Response\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>HTTP/1.1 browser cap\u003c/td>\u003ctd>About six connections per origin, shared across tabs\u003c/td>\u003ctd>Serve over HTTP/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Idle timeouts\u003c/td>\u003ctd>Quiet streams get closed\u003c/td>\u003ctd>Send a comment line such as \u003ccode>: ping\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No custom headers\u003c/td>\u003ctd>\u003ccode>EventSource\u003c/code> cannot set \u003ccode>Authorization\u003c/code>\u003c/td>\u003ctd>Use a cookie or a fetch-based client\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Open connections\u003c/td>\u003ctd>Each client holds server resources\u003c/td>\u003ctd>Prefer an \u003ca href=\"#Event%20loop\" data-term=\"Event loop\">event loop\u003c/a> server\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","avoid":"","usage":["The progress bar sits at zero, then jumps to 100 at the end.","The events are being buffered by nginx. Turn buffering off for the SSE route."],"out":[0,4,7,38]},{"name":"Long polling","section":0,"description":"A client request the server holds open until data is ready or a timeout passes, after which the client immediately asks again.","body":"\u003cp>Long polling is a technique for receiving updates over ordinary \u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a> requests. The client sends a request, and the server holds it open instead of answering immediately. When new data appears, the server responds. If nothing happens before a timeout, it returns an empty response such as \u003ccode>204 No Content\u003c/code>. Either way, the client immediately sends the next request.\u003c/p>\u003cp>Regular polling asks on a fixed schedule, so most responses are empty and updates wait for the next tick. Long polling delivers an update soon after it occurs and needs no special protocol, so it works through most proxies and firewalls.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Technique\u003c/th>\u003cth>Direction\u003c/th>\u003cth>Latency\u003c/th>\u003cth>Connection cost\u003c/th>\u003cth>Infrastructure\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Short polling\u003c/td>\u003ctd>Client asks\u003c/td>\u003ctd>Up to one interval\u003c/td>\u003ctd>Repeated requests\u003c/td>\u003ctd>Plain HTTP\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Long polling\u003c/td>\u003ctd>Server to client\u003c/td>\u003ctd>Low\u003c/td>\u003ctd>One held request per client\u003c/td>\u003ctd>Plain HTTP\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Server-Sent%20Events\" data-term=\"Server-Sent Events\">Server-Sent Events\u003c/a>\u003c/td>\u003ctd>Server to client\u003c/td>\u003ctd>Low\u003c/td>\u003ctd>One open stream\u003c/td>\u003ctd>Plain HTTP, no buffering\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#WebSocket\" data-term=\"WebSocket\">WebSocket\u003c/a>\u003c/td>\u003ctd>Both\u003c/td>\u003ctd>Low\u003c/td>\u003ctd>One open socket\u003c/td>\u003ctd>Upgrade support\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A common bug is losing events between polls. If an event fires after one response is sent and before the next request arrives, a server that only reports &quot;what happens while you are connected&quot; never delivers it. Have the client send the ID or cursor of the last event it received, and return everything after that point.\u003c/p>\u003cp>Set the hold time below every timeout in the path. If a proxy gives up at 30 seconds and the server holds for 60, clients see regular 504 errors during quiet periods. Add a short random delay after errors so a restart does not bring every client back at once.\u003c/p>\u003cp>Held requests also consume capacity. On a server that dedicates a \u003ca href=\"#Thread\" data-term=\"Thread\">thread\u003c/a> to each request, a few hundred waiting clients can exhaust the pool, so this pattern fits non-blocking servers better.\u003c/p>","avoid":"","usage":["Users sometimes miss a notification until they refresh.","Our long polling drops anything that fires between requests. Send the last event ID on each poll."],"out":[0,8,7,36]},{"name":"REST","section":1,"description":"An architectural style for APIs built around resources, standard HTTP methods and stateless requests.","body":"\u003cp>REST (Representational State Transfer) is an architectural style for networked APIs, described by Roy Fielding in his 2000 doctoral dissertation. A REST API exposes resources, such as orders or users, at URLs. Clients act on them through standard \u003ca href=\"#HTTP%20method\" data-term=\"HTTP method\">HTTP methods\u003c/a> and exchange representations of them, usually JSON.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Operation\u003c/th>\u003cth>Request\u003c/th>\u003cth>Typical success\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>List orders\u003c/td>\u003ctd>\u003ccode>GET /orders\u003c/code>\u003c/td>\u003ctd>200\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read one order\u003c/td>\u003ctd>\u003ccode>GET /orders/42\u003c/code>\u003c/td>\u003ctd>200\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Create an order\u003c/td>\u003ctd>\u003ccode>POST /orders\u003c/code>\u003c/td>\u003ctd>201 with a \u003ccode>Location\u003c/code> header\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Replace an order\u003c/td>\u003ctd>\u003ccode>PUT /orders/42\u003c/code>\u003c/td>\u003ctd>200 or 204\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Update some fields\u003c/td>\u003ctd>\u003ccode>PATCH /orders/42\u003c/code>\u003c/td>\u003ctd>200 or 204\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Delete an order\u003c/td>\u003ctd>\u003ccode>DELETE /orders/42\u003c/code>\u003c/td>\u003ctd>204\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Fielding's constraints include a client-server split, stateless requests, cacheable responses, a uniform interface and a layered system. Statelessness means each request carries its own context, so any server instance can handle it. Cacheability means GET responses can be reused by browsers and proxies when their headers allow it.\u003c/p>\u003cp>Most APIs described as REST follow only part of this. The full style includes hypermedia, where responses contain links telling the client what it can do next, and few JSON APIs implement it. In everyday use, &quot;REST&quot; usually means resource-oriented JSON over \u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a>.\u003c/p>\u003cp>The practical benefit comes from following the conventions, because clients, proxies and monitoring already understand them. Endpoints such as \u003ccode>POST /getUser\u003c/code> or a \u003ccode>200\u003c/code> response wrapping an error discard that shared understanding: responses cannot be cached, retries are unsafe to automate and error rates read as zero. Return an accurate \u003ca href=\"#Status%20code\" data-term=\"Status code\">status code\u003c/a>.\u003c/p>\u003cp>REST can be awkward when clients need differently shaped data, leading to several round trips or oversized responses. \u003ca href=\"#GraphQL\" data-term=\"GraphQL\">GraphQL\u003c/a> addresses that case, and \u003ca href=\"#gRPC\" data-term=\"gRPC\">gRPC\u003c/a> is common for internal service calls. An \u003ca href=\"#OpenAPI\" data-term=\"OpenAPI\">OpenAPI\u003c/a> document is the usual way to describe a REST API.\u003c/p>","avoid":"","usage":["Should cancelling an order be a DELETE?","No, the order still exists afterwards. In REST terms, either PATCH its status or POST to a \u003ccode>/orders/42/cancellation\u003c/code> resource."],"out":[1,0,2,11,12,14]},{"name":"GraphQL","section":1,"description":"A query language and API runtime where clients request exactly the fields they need from a typed schema, usually via one endpoint.","body":"\u003cp>GraphQL is a query language and server runtime for APIs. The server publishes a typed schema describing its data, and each client sends a query naming the fields it wants, usually to a single endpoint over \u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a>. The response has the same shape as the query.\u003c/p>\u003cpre>\u003ccode>query {\n  order(id: &quot;42&quot;) {\n    status\n    customer { name }\n  }\n}\u003c/code>\u003c/pre>\u003cp>This addresses two problems common with \u003ca href=\"#REST\" data-term=\"REST\">REST\u003c/a>: fetching more data than a screen needs, and making several round trips to assemble one view. The server implements a resolver, a small function that fetches one field.\u003c/p>\u003cp>That flexibility moves work and risk to the server:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Problem\u003c/th>\u003cth>Symptom\u003c/th>\u003cth>What to do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>N+1 queries\u003c/td>\u003ctd>A list of 50 items triggers 51 database queries\u003c/td>\u003ctd>Batch lookups per request, as DataLoader does\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Expensive queries\u003c/td>\u003ctd>A deeply nested query ties up the server\u003c/td>\u003ctd>Enforce depth and cost limits, plus timeouts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Field-level access\u003c/td>\u003ctd>A private field is reachable through another type\u003c/td>\u003ctd>Apply \u003ca href=\"#Authorization\" data-term=\"Authorization\">authorization\u003c/a> in the business layer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>HTTP caching\u003c/td>\u003ctd>Queries sent by POST bypass shared caches\u003c/td>\u003ctd>Use persisted queries sent by GET\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error handling\u003c/td>\u003ctd>Failures hidden behind a 200\u003c/td>\u003ctd>Monitor the \u003ccode>errors\u003c/code> array in responses\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The access-control row deserves care. Because the graph can reach the same object along several paths, a check placed on one resolver can be bypassed by another path to the same data. Put the rule in code that every path shares.\u003c/p>\u003cp>Public GraphQL APIs accept arbitrary queries from strangers, so limits are required. For APIs used only by your own clients, an allowlist of persisted queries, where only pre-registered queries can run, closes off most of this risk.\u003c/p>\u003cp>Evolving a schema usually means adding fields and marking old ones \u003ccode>@deprecated\u003c/code> instead of using \u003ca href=\"#API%20versioning\" data-term=\"API versioning\">API versioning\u003c/a>. Removing a field is still a \u003ca href=\"#Breaking%20change\" data-term=\"Breaking change\">breaking change\u003c/a>.\u003c/p>","avoid":"","usage":["The orders page got slow after we added the customer's name.","That's N+1 in the GraphQL resolver. It fetches each customer separately, so batch them with a loader."],"out":[0,10,22,17,18]},{"name":"gRPC","section":1,"description":"A remote procedure call framework using HTTP/2 and Protocol Buffers, common for typed communication between internal services.","body":"\u003cp>gRPC is a framework for calling a function on another service as if it were a local method. You define services and messages in a \u003ca href=\"#Protocol%20Buffers\" data-term=\"Protocol Buffers\">Protocol Buffers\u003c/a> file, then generate client and server code for your languages. Calls run over \u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a>/2 and their payloads are compact binary.\u003c/p>\u003cpre>\u003ccode>service Orders {\n  rpc GetOrder (GetOrderRequest) returns (Order);\n}\u003c/code>\u003c/pre>\u003cp>gRPC supports four call shapes:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Client sends\u003c/th>\u003cth>Server sends\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Unary\u003c/td>\u003ctd>One message\u003c/td>\u003ctd>One message\u003c/td>\u003ctd>Fetch an order\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Server streaming\u003c/td>\u003ctd>One message\u003c/td>\u003ctd>Many\u003c/td>\u003ctd>Stream search results\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client streaming\u003c/td>\u003ctd>Many\u003c/td>\u003ctd>One message\u003c/td>\u003ctd>Upload metric batches\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bidirectional streaming\u003c/td>\u003ctd>Many\u003c/td>\u003ctd>Many\u003c/td>\u003ctd>Live two-way sync\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>It is most common between internal services, where shared schemas and generated clients prevent mismatched payloads. Browsers cannot speak native gRPC because their APIs do not expose the required HTTP/2 control, so browser clients need gRPC-Web or a translating proxy. For public APIs, \u003ca href=\"#REST\" data-term=\"REST\">REST\u003c/a> remains easier for outside developers to consume.\u003c/p>\u003cp>Deadlines are a standard feature and should be set on every call. A deadline says how long the caller will wait, and it propagates to downstream gRPC calls when the context is passed along. A service with no deadline can hang indefinitely on a stuck dependency, tying up its own capacity while it waits.\u003c/p>\u003cp>A frequent production surprise concerns load balancing. Because HTTP/2 multiplexes many calls over one long-lived connection, a balancer working at the connection level sends all of a client's calls to one instance. New instances then sit idle while one is overloaded. Use a balancer that understands individual requests, or client-side balancing.\u003c/p>\u003cp>gRPC reports errors with its own codes, such as \u003ccode>UNAVAILABLE\u003c/code> and \u003ccode>DEADLINE_EXCEEDED\u003c/code>, which are separate from HTTP \u003ca href=\"#Status%20code\" data-term=\"Status code\">status codes\u003c/a>.\u003c/p>","avoid":"","usage":["We scaled to six pods but one is still taking all the traffic.","gRPC keeps one HTTP/2 connection open, so the L4 balancer pins it to one pod. We need request-level balancing."],"out":[13,0,10,2]},{"name":"Protocol Buffers","section":1,"description":"A language-neutral schema and compact binary format for structured data, identifying each field by a number instead of a name.","body":"\u003cp>Protocol Buffers, or Protobuf, is a schema language and binary serialization format created at Google. You define messages in a \u003ccode>.proto\u003c/code> file, and a compiler generates types for each language you use. It is the default message format for \u003ca href=\"#gRPC\" data-term=\"gRPC\">gRPC\u003c/a>.\u003c/p>\u003cpre>\u003ccode>message Order {\n  string id = 1;\n  int64 total_cents = 2;\n  optional string coupon = 3;\n}\u003c/code>\u003c/pre>\u003cp>The numbers are field numbers, and they are what goes on the wire. Field names are not sent in the binary format, which keeps messages small. It also means the number is the identity of the field: two programs agree on what a value means only because they agree on its number.\u003c/p>\u003cp>This drives the rules for changing a schema safely:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Change\u003c/th>\u003cth>Safe?\u003c/th>\u003cth>Why\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Add a field with a new number\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Old readers skip fields they do not know\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Remove a field and reserve it\u003c/td>\u003ctd>Yes, if readers tolerate its absence\u003c/td>\u003ctd>\u003ccode>reserved\u003c/code> stops the number being reused\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rename a field\u003c/td>\u003ctd>Binary yes, JSON no\u003c/td>\u003ctd>The number is unchanged, but JSON uses names and generated code changes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Change a field's type\u003c/td>\u003ctd>Usually no\u003c/td>\u003ctd>Only some types are compatible, and values may be truncated\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reuse an old field number\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Old data and old clients misread the new field\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Reusing a number is the failure to watch for. Nothing errors. A service still running the old schema decodes the new value as the old field, producing wrong data that can go unnoticed. When deleting a field, add \u003ccode>reserved 3;\u003c/code> so the compiler rejects reuse. Treat any unsafe change as a \u003ca href=\"#Breaking%20change\" data-term=\"Breaking change\">breaking change\u003c/a>.\u003c/p>\u003cp>In proto3, a plain scalar field cannot distinguish &quot;unset&quot; from its default, such as \u003ccode>0\u003c/code> or an empty string. A discount of zero and a missing discount look identical. Mark the field \u003ccode>optional\u003c/code> when that difference matters.\u003c/p>","avoid":"","usage":["Old consumers are suddenly showing refund amounts as customer IDs.","Someone reused field number 4 in the Protobuf schema. Give it a new number and mark 4 as reserved."],"out":[12,18]},{"name":"OpenAPI","section":1,"description":"A standard machine-readable format for describing HTTP APIs, used to generate docs, clients and request validation.","body":"\u003cp>OpenAPI is a specification for describing an \u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a> API in a YAML or JSON file. The document lists paths, \u003ca href=\"#HTTP%20method\" data-term=\"HTTP method\">HTTP methods\u003c/a>, parameters, request and response bodies, \u003ca href=\"#Status%20code\" data-term=\"Status code\">status codes\u003c/a> and security schemes. It was formerly called Swagger, and that name survives in tools such as Swagger UI.\u003c/p>\u003cpre>\u003ccode>paths:\n  /orders/{id}:\n    get:\n      parameters:\n        - { name: id, in: path, required: true, schema: { type: string } }\n      responses:\n        &quot;200&quot;:\n          description: The order\u003c/code>\u003c/pre>\u003cp>Because the file is machine-readable, one description can drive several tools: interactive documentation, generated client SDKs, mock servers, request validation and automated checks. It is most often used with \u003ca href=\"#REST\" data-term=\"REST\">REST\u003c/a> style APIs.\u003c/p>\u003cp>Teams usually choose one of two workflows:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Workflow\u003c/th>\u003cth>Source of truth\u003c/th>\u003cth>Benefit\u003c/th>\u003cth>Risk\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Spec-first\u003c/td>\u003ctd>The OpenAPI file\u003c/td>\u003ctd>API is reviewed before code is written\u003c/td>\u003ctd>Code can diverge without enforcement\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Code-first\u003c/td>\u003ctd>Annotated code\u003c/td>\u003ctd>Spec is generated, so less to maintain\u003c/td>\u003ctd>Design follows implementation details\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The main failure is drift, where the document stops matching the running service. A consumer generates a client from the spec, ships it, then gets a validation error because a field documented as a number is actually returned as a string. Hand-maintained documents drift unless something checks them.\u003c/p>\u003cp>Reduce drift by generating the spec from code, or by validating real requests and responses against it in tests. A \u003ca href=\"#Contract%20test\" data-term=\"Contract test\">contract test\u003c/a> can use the document as the agreed interface. Comparing the spec between commits in CI, the automated build pipeline, can also flag a \u003ca href=\"#Breaking%20change\" data-term=\"Breaking change\">breaking change\u003c/a> before it merges.\u003c/p>\u003cp>An OpenAPI file describes the shape of an API, and it says little about behaviour. It will not capture ordering guarantees, rate-limit strategy or which fields depend on each other unless you write that in its descriptions.\u003c/p>","avoid":"","usage":["The generated client crashes because \u003ccode>amount\u003c/code> comes back as a string.","So the OpenAPI spec has drifted from the service. Add response validation to the API tests so this fails in CI."],"out":[0,1,2,10,59,18]},{"name":"Pagination","section":1,"description":"Returning a large result set in smaller pieces so that no single response has to load, serialize and send everything.","body":"\u003cp>Pagination is splitting a large list into smaller responses that a client requests one at a time. Without it, an endpoint such as \u003ccode>GET /orders\u003c/code> works in development with 20 rows, then times out or runs the server out of memory once a customer has several hundred thousand. The server has to load, serialize and send everything in one response.\u003c/p>\u003cp>There are three common approaches:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Approach\u003c/th>\u003cth>Request\u003c/th>\u003cth>Strength\u003c/th>\u003cth>Weakness\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Offset\u003c/td>\u003ctd>\u003ccode>?limit=50&amp;offset=100\u003c/code>\u003c/td>\u003ctd>Simple, can jump to any page\u003c/td>\u003ctd>Slows with depth, shifts during writes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Page number\u003c/td>\u003ctd>\u003ccode>?page=3&amp;per_page=50\u003c/code>\u003c/td>\u003ctd>Maps to numbered page UI\u003c/td>\u003ctd>Same as offset\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Cursor%20pagination\" data-term=\"Cursor pagination\">Cursor\u003c/a>\u003c/td>\u003ctd>\u003ccode>?limit=50&amp;after=abc123\u003c/code>\u003c/td>\u003ctd>Stable and fast at any depth\u003c/td>\u003ctd>No jumping to an arbitrary page\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Offset pagination has two known problems. The database generally has to walk past all skipped rows, so page 10,000 is much slower than page 1. Results also shift when data changes between requests. If a row is inserted at the top while a client is reading, the last item of page 1 reappears as the first item of page 2. If a row is deleted, an item gets skipped.\u003c/p>\u003cp>Some rules apply to any approach. Always enforce a server-side maximum page size, because a client-supplied \u003ccode>limit=1000000\u003c/code> removes the protection. Sort by a deterministic order that ends in a unique column, such as \u003ccode>created_at, id\u003c/code>. Without a tie-breaker, rows sharing a timestamp can appear on two pages or on none.\u003c/p>\u003cp>Be careful with total counts. A \u003ccode>total\u003c/code> field looks cheap, but counting a large filtered set can cost more than fetching the page. Consider omitting it, approximating it or returning only a \u003ccode>has_more\u003c/code> flag. Changing the pagination style of a published endpoint is usually a \u003ca href=\"#Breaking%20change\" data-term=\"Breaking change\">breaking change\u003c/a>.\u003c/p>","avoid":"","usage":["The export job keeps seeing the same invoice twice.","It's using offset pagination while new invoices come in. Switch it to a cursor on \u003ccode>created_at\u003c/code> and \u003ccode>id\u003c/code>."],"out":[16,18]},{"name":"Cursor pagination","section":1,"description":"Fetching the next page by remembering the last item seen, which stays fast and stable while data changes.","body":"\u003cp>Cursor \u003ca href=\"#Pagination\" data-term=\"Pagination\">pagination\u003c/a> is a method where each request says &quot;give me the items after this one&quot; instead of &quot;skip N items&quot;. The server returns a page and a cursor, an opaque token that marks the position of the last item. The client sends that token back to get the next page.\u003c/p>\u003cpre>\u003ccode>SELECT id, created_at, total\nFROM orders\nWHERE (created_at, id) &lt; ($1, $2)\nORDER BY created_at DESC, id DESC\nLIMIT 51;\u003c/code>\u003c/pre>\u003cp>The cursor here encodes the \u003ccode>created_at\u003c/code> and \u003ccode>id\u003c/code> of the last row. Some databases need this row comparison written out. With an index on \u003ccode>(created_at, id)\u003c/code>, the database jumps to the position directly, so the thousandth page costs about the same as the first. Inserts and deletes elsewhere do not shift the position, which removes the duplicated and skipped rows seen with offsets.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Requests the first page with a limit of 50\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Server\u003c/td>\u003ctd>Fetches 51 rows, so the extra row shows whether more exist\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Server\u003c/td>\u003ctd>Returns 50 rows and a cursor built from the 50th\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Sends the cursor to fetch the next page\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Server\u003c/td>\u003ctd>Decodes and validates it, then continues from that position\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The sort must end in a unique column. If you sort by \u003ccode>created_at\u003c/code> alone, rows with the same timestamp at a page boundary get lost.\u003c/p>\u003cp>Keep cursors opaque, for example base64-encoded, so clients do not depend on their contents and you can change the format later. Encoding is not protection, so treat a decoded cursor as untrusted input: validate it, use bound parameters to prevent \u003ca href=\"#SQL%20injection\" data-term=\"SQL injection\">SQL injection\u003c/a>, and apply normal \u003ca href=\"#Authorization\" data-term=\"Authorization\">authorization\u003c/a> filters on every page.\u003c/p>\u003cp>The trade-off is navigation. You cannot jump to page 37, and a cursor is tied to its sort order, so changing the sort requires starting again.\u003c/p>","avoid":"","usage":["Deep pages on the activity feed take seconds to load.","That's the offset scanning past every row. Cursor pagination on \u003ccode>(created_at, id)\u003c/code> will keep it constant."],"out":[15,32,22]},{"name":"API versioning","section":1,"description":"Running more than one version of an API contract so existing clients keep working while the interface changes.","body":"\u003cp>API versioning is a way of publishing changed behaviour without breaking clients that depend on the old behaviour. Clients state which version they expect, and the server honours that contract. It exists because you cannot update every consumer at the moment you deploy, particularly mobile apps and third-party integrations.\u003c/p>\u003cp>Versioning is needed for a \u003ca href=\"#Breaking%20change\" data-term=\"Breaking change\">breaking change\u003c/a>. Additive changes, such as a new optional field, normally ship without a new version.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Strategy\u003c/th>\u003cth>Example\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>URL path\u003c/td>\u003ctd>\u003ccode>/v2/orders\u003c/code>\u003c/td>\u003ctd>Obvious and easy to route, but coarse\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Custom header\u003c/td>\u003ctd>\u003ccode>Api-Version: 2\u003c/code>\u003c/td>\u003ctd>Clean URLs, harder to test in a browser\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Media type\u003c/td>\u003ctd>\u003ccode>Accept: application/vnd.acme.v2+json\u003c/code>\u003c/td>\u003ctd>Precise, less familiar to clients\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Query parameter\u003c/td>\u003ctd>\u003ccode>/orders?version=2\u003c/code>\u003c/td>\u003ctd>Easy to use, can complicate caching\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dated versions\u003c/td>\u003ctd>\u003ccode>Api-Version: 2026-01-15\u003c/code>\u003c/td>\u003ctd>Fine-grained, requires a translation layer\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>If a version is selected by a header, any cache in front of the API must vary on that header. Otherwise one client can receive a response cached for another version.\u003c/p>\u003cp>The ongoing cost is maintenance. Each live version has to be tested, patched and kept secure, and copying handlers per version multiplies every future bug fix. A common structure keeps one current implementation and adds thin adapters that translate older requests and responses at the boundary.\u003c/p>\u003cp>A version also needs a retirement plan. Track usage per version and per client, announce a date, and signal it in responses, for example with the standard \u003ccode>Sunset\u003c/code> header. Contact remaining users before the date. Teams that skip this step end up supporting \u003ccode>/v1\u003c/code> indefinitely because nobody knows who still calls it.\u003c/p>\u003cp>\u003ca href=\"#GraphQL\" data-term=\"GraphQL\">GraphQL\u003c/a> APIs tend to avoid numbered versions by deprecating fields, and \u003ca href=\"#Protocol%20Buffers\" data-term=\"Protocol Buffers\">Protocol Buffers\u003c/a> schemas evolve through compatible changes, but both still need a plan for removing old fields.\u003c/p>","avoid":"","usage":["Can we finally delete \u003ccode>/v1\u003c/code>?","Not yet. API versioning metrics show one partner still calling it, so send them the sunset date first."],"out":[18,11,13]},{"name":"Breaking change","section":1,"description":"A change to an interface that makes correct existing clients fail or misbehave without any change on their side.","body":"\u003cp>A breaking change is a modification to an interface that causes a previously correct client to fail or behave incorrectly. The symptom usually appears as a deploy that passed all of the service's own tests, followed by errors in a different team's application.\u003c/p>\u003cp>Some breaks are obvious and others are not:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Change\u003c/th>\u003cth>Breaking?\u003c/th>\u003cth>Reason\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Add an optional request field\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Existing requests remain valid\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add a response field\u003c/td>\u003ctd>Usually no\u003c/td>\u003ctd>Strict parsers may reject unknown fields\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Remove or rename a field\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Clients still read the old name\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Change a type, such as number to string\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Parsing or arithmetic fails\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Make an optional request field required\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Existing requests are rejected\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tighten validation\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Previously accepted input now fails\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Add an enum value\u003c/td>\u003ctd>Often\u003c/td>\u003ctd>Exhaustive client code hits an unknown case\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Change a default, sort order or \u003ca href=\"#Status%20code\" data-term=\"Status code\">status code\u003c/a>\u003c/td>\u003ctd>Often\u003c/td>\u003ctd>Clients may rely on it\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The last two rows catch people out. Clients depend on observed behaviour as well as on documentation, so an undocumented sort order can become something a consumer relies on. Whether a change breaks anyone depends on actual usage.\u003c/p>\u003cp>The safe way to make an incompatible change is expand and contract:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Add the new field or endpoint beside the old one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Serve both and migrate consumers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Measure until the old one has no traffic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Remove the old one\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>When this is impractical, publish the change under \u003ca href=\"#API%20versioning\" data-term=\"API versioning\">API versioning\u003c/a>. Catch breaks before release by diffing an \u003ca href=\"#OpenAPI\" data-term=\"OpenAPI\">OpenAPI\u003c/a> or \u003ca href=\"#Protocol%20Buffers\" data-term=\"Protocol Buffers\">Protocol Buffers\u003c/a> schema in CI, the automated build pipeline, and by running a \u003ca href=\"#Contract%20test\" data-term=\"Contract test\">contract test\u003c/a> for each known consumer. Note that during a rolling deploy, old and new versions run at once, so even internal changes must be compatible across that window.\u003c/p>","avoid":"","usage":["We only renamed \u003ccode>userId\u003c/code> to \u003ccode>user_id\u003c/code>. Why is mobile crashing?","That's a breaking change. Old app versions still read \u003ccode>userId\u003c/code>, so return both until they've gone."],"out":[2,17,14,13,59]},{"name":"Idempotency key","section":1,"description":"A unique client-generated value sent with a request so that retries repeat the original result instead of the side effect.","body":"\u003cp>An idempotency key is a unique value a client attaches to a request so the server performs the operation at most once, however many times the request is retried. It addresses a specific problem: a customer clicks Pay, the connection times out, the client retries, and the customer is charged twice. After a timeout, the client cannot know whether the first attempt succeeded.\u003c/p>\u003cp>A \u003ca href=\"#HTTP%20method\" data-term=\"HTTP method\">POST\u003c/a> is not naturally idempotent, so the key supplies that property. The client generates a value such as a UUID for each logical operation and reuses it on every retry, commonly in an \u003ccode>Idempotency-Key\u003c/code> header.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Generates a key and sends the request\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Server\u003c/td>\u003ctd>Atomically inserts the key with a hash of the request, marked in progress\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Server\u003c/td>\u003ctd>If the key is new, runs the operation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Server\u003c/td>\u003ctd>Stores the response with the key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Retries with the same key after a failure\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Server\u003c/td>\u003ctd>Returns the stored response without repeating the work\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The insert must rely on a unique constraint, because a separate &quot;check, then insert&quot; lets two concurrent retries both pass, which is a \u003ca href=\"#Race%20condition\" data-term=\"Race condition\">race condition\u003c/a>. A request arriving during the first should get a 409 conflict. If the same key arrives with a different body, reject it.\u003c/p>\u003cp>Scope keys to the account or API client so customers cannot collide. Keep them for longer than your longest retry window, then expire them.\u003c/p>\u003cp>Where possible, commit the key and the business change in one database transaction. If the operation calls an external provider, pass a key to that provider too, otherwise a crash between its success and your commit can still repeat the charge. A \u003ca href=\"#Webhook\" data-term=\"Webhook\">webhook\u003c/a> receiver needs similar deduplication, using the event ID.\u003c/p>","avoid":"","usage":["A customer got charged twice after the app timed out.","The retry created a second payment. Generate one idempotency key per checkout and reuse it on retries."],"out":[1,41,20]},{"name":"Webhook","section":1,"description":"An HTTP request one system sends to a URL you register, notifying you that an event happened.","body":"\u003cp>A webhook is an \u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a> request that one system sends to a URL you registered, to tell you an event occurred. A payment provider might POST to \u003ccode>/webhooks/payments\u003c/code> when a charge succeeds. It replaces polling the provider for changes.\u003c/p>\u003cp>Your endpoint is public and deliveries are unreliable, so follow a fixed sequence:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>What to do\u003c/th>\u003cth>Why\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Read the raw request body\u003c/td>\u003ctd>Signatures cover the exact bytes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Verify the signature using a constant-time comparison\u003c/td>\u003ctd>Anyone can POST to a public URL\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Reject stale timestamps if the provider signs one\u003c/td>\u003ctd>Limits replay of captured requests\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Store the event, ignoring an ID already seen\u003c/td>\u003ctd>Deliveries can repeat\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Enqueue a \u003ca href=\"#Background%20job\" data-term=\"Background job\">background job\u003c/a> and return 2xx\u003c/td>\u003ctd>Slow handlers trigger retries\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Most providers deliver at least once and retry on any non-2xx response or timeout. If your handler does slow work before responding, the provider times out and resends, and the customer receives two confirmation emails. Acknowledge quickly and process afterwards.\u003c/p>\u003cp>Signature failures are a common integration bug. Many providers sign the raw body with HMAC, a keyed hash, and a JSON parser in your \u003ca href=\"#Middleware\" data-term=\"Middleware\">middleware\u003c/a> that re-serializes the body changes the bytes, so valid requests fail verification. Capture the raw body for this route. Do not respond by disabling the check.\u003c/p>\u003cp>Delivery order is generally not guaranteed. A \u003ccode>subscription.updated\u003c/code> event can arrive before \u003ccode>subscription.created\u003c/code>. Use timestamps or version numbers in the payload, or fetch the current state from the provider's API when an event arrives.\u003c/p>\u003cp>If your product sends webhooks to customer-supplied URLs, that feature is an \u003ca href=\"#SSRF\" data-term=\"SSRF\">SSRF\u003c/a> risk. Validate destinations and block internal addresses. Sign each delivery, retry with increasing delays and let customers replay failures.\u003c/p>","avoid":"","usage":["The provider says the webhook failed, but our handler logged success.","The handler takes 40 seconds, so they timed out and retried. Queue the work and return 200 right after verifying."],"out":[0,44,4,33]},{"name":"Authentication","section":2,"description":"Verifying who is making a request, using something like a password, passkey, session or token.","body":"\u003cp>Authentication is the process of verifying who is making a request. It is separate from \u003ca href=\"#Authorization\" data-term=\"Authorization\">authorization\u003c/a>, which decides what that identity may do. A failed authentication normally returns \u003ca href=\"#Status%20code\" data-term=\"Status code\">status code\u003c/a> 401, and a known user who lacks permission gets 403.\u003c/p>\u003cp>Authentication usually happens twice. First, a user proves their identity at login. The server then issues a credential that proves it on later requests, because \u003ca href=\"#HTTP\" data-term=\"HTTP\">HTTP\u003c/a> keeps no state between them.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Credential\u003c/th>\u003cth>Typical caller\u003c/th>\u003cth>Revocation\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#Session%20cookie\" data-term=\"Session cookie\">Session cookie\u003c/a>\u003c/td>\u003ctd>Browser users\u003c/td>\u003ctd>Immediate, by deleting the session\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#JWT\" data-term=\"JWT\">JWT\u003c/a> access token\u003c/td>\u003ctd>APIs and services\u003c/td>\u003ctd>Usually waits for expiry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#API%20key\" data-term=\"API key\">API key\u003c/a>\u003c/td>\u003ctd>Scripts and integrations\u003c/td>\u003ctd>Immediate, by deleting the key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client certificate\u003c/td>\u003ctd>Internal services\u003c/td>\u003ctd>Through certificate revocation or short lifetimes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Login endpoints need specific defences. Store passwords only with \u003ca href=\"#Password%20hashing\" data-term=\"Password hashing\">password hashing\u003c/a>. Rate-limit attempts per account and per source, because attackers replay leaked credentials from other sites. Offer multi-factor authentication. Passkeys and hardware keys resist phishing, authenticator codes are weaker, and SMS is weaker still.\u003c/p>\u003cp>Avoid revealing which accounts exist. A form that says &quot;no account with that email&quot; lets an attacker test a list of addresses. Return the same message for a wrong email and a wrong password, and apply the same approach to password reset and signup flows. Response time can leak the same fact, so hash a dummy value when the account does not exist.\u003c/p>\u003cp>Issue a new session identifier at login, invalidate sessions on logout a
