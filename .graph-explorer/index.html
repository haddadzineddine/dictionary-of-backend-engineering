nd password change, and ask for the password again before sensitive actions such as changing an email address. Where possible, use a maintained library or an identity provider through \u003ca href=\"#OpenID%20Connect\" data-term=\"OpenID Connect\">OpenID Connect\u003c/a> instead of writing this yourself.\u003c/p>","avoid":"","usage":["Our login page says 'unknown email' when the address isn't registered.","That leaks which accounts exist. Authentication errors should read the same for a bad email and a bad password."],"out":[22,2,0,23,24,29,30,26]},{"name":"Authorization","section":2,"description":"Deciding whether an already identified caller may perform a specific action on a specific resource.","body":"\u003cp>Authorization is the decision about whether a known caller may perform a specific action on a specific resource. It runs after \u003ca href=\"#Authentication\" data-term=\"Authentication\">authentication\u003c/a>, which establishes who the caller is. When the check fails, the server normally returns \u003ca href=\"#Status%20code\" data-term=\"Status code\">status code\u003c/a> 403, or 404 if the existence of the resource should stay hidden.\u003c/p>\u003cp>The most common failure is a missing check on an individual object. A logged-in user opens \u003ccode>/invoices/1001\u003c/code>, changes the number to \u003ccode>1002\u003c/code> and sees another customer's invoice. Nothing verified that this invoice belongs to this user. This flaw is known as an insecure direct object reference (IDOR), or broken object-level authorization. Unguessable IDs make it harder to exploit, but they do not fix it.\u003c/p>\u003cp>Authorization happens at several levels:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Question\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Function\u003c/td>\u003ctd>May this caller use this operation?\u003c/td>\u003ctd>Only admins can issue refunds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Object\u003c/td>\u003ctd>May they act on this particular record?\u003c/td>\u003ctd>Users read only their own invoices\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Field\u003c/td>\u003ctd>May they read or set this property?\u003c/td>\u003ctd>Users cannot set their own \u003ccode>role\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Enforce every check on the server, because hiding a button changes nothing for someone calling the API directly. Deny by default, so a forgotten rule fails closed. Check on every request, including list, export and bulk endpoints, and on any \u003ca href=\"#Background%20job\" data-term=\"Background job\">background job\u003c/a> acting for a user. Scope queries to the tenant or owner, such as \u003ccode>WHERE id = ? AND account_id = ?\u003c/code>.\u003c/p>\u003cp>Keep rules in one shared place and not scattered across handlers. \u003ca href=\"#RBAC\" data-term=\"RBAC\">RBAC\u003c/a> grants permissions through roles, while \u003ca href=\"#ABAC\" data-term=\"ABAC\">ABAC\u003c/a> evaluates attributes of the user, resource and context. Write tests asserting that one user cannot reach another user's data, because normal feature tests only exercise the permitted path.\u003c/p>","avoid":"","usage":["QA changed the order ID in the URL and got someone else's receipt.","That's a missing authorization check. Load the order scoped to the current account and return 404 if it isn't theirs."],"out":[21,2,44,27,28]},{"name":"Session cookie","section":2,"description":"A browser cookie holding a random ID that points to login state stored on the server.","body":"\u003cp>A session cookie is a browser cookie containing a random identifier that maps to login state on the server. After \u003ca href=\"#Authentication\" data-term=\"Authentication\">authentication\u003c/a>, the server creates a session record and sends its ID with a \u003ccode>Set-Cookie\u003c/code> header. The browser attaches the cookie to later requests, and the server looks up the session to identify the user.\u003c/p>\u003cp>Because the state stays on the server, revocation is immediate: delete the record and the cookie stops working. A self-contained \u003ca href=\"#JWT\" data-term=\"JWT\">JWT\u003c/a> does not offer this by default. The cost is a lookup on each request and a store shared by all server instances. If sessions live in one process's memory, users appear to be logged out at random once a second instance is added or the app restarts.\u003c/p>\u003cp>Cookie attributes control exposure:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Attribute\u003c/th>\u003cth>Effect\u003c/th>\u003cth>Recommended\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>HttpOnly\u003c/code>\u003c/td>\u003ctd>JavaScript cannot read the cookie\u003c/td>\u003ctd>Always\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Secure\u003c/code>\u003c/td>\u003ctd>Sent only over HTTPS\u003c/td>\u003ctd>Always in production\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>SameSite\u003c/code>\u003c/td>\u003ctd>Limits sending on cross-site requests\u003c/td>\u003ctd>\u003ccode>Lax\u003c/code> or \u003ccode>Strict\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Path\u003c/code> / \u003ccode>Domain\u003c/code>\u003c/td>\u003ctd>Limits where the cookie is sent\u003c/td>\u003ctd>Omit \u003ccode>Domain\u003c/code> to stay host-only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Max-Age\u003c/code>\u003c/td>\u003ctd>Sets a lifetime\u003c/td>\u003ctd>As short as the product allows\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003ccode>HttpOnly\u003c/code> reduces the damage of cross-site scripting (attacker JavaScript running on your page), since the script cannot steal the ID, though it can still act within the page. \u003ccode>SameSite\u003c/code> helps against \u003ca href=\"#CSRF\" data-term=\"CSRF\">CSRF\u003c/a>, but state-changing routes should still have a dedicated defence.\u003c/p>\u003cp>Generate a long ID with a cryptographically secure random generator. Issue a new ID at login and on privilege changes, which prevents session fixation, where an attacker plants a known ID before the victim logs in. On logout, delete the record on the server as well as clearing the cookie. Apply both an idle timeout and an absolute expiry.\u003c/p>","avoid":"","usage":["Since we added a second instance, people keep getting logged out.","Session cookies point to in-process memory, so the other instance can't find them. Move sessions to a shared store."],"out":[21,24,31]},{"name":"JWT","section":2,"description":"A signed, self-contained token carrying claims a server can verify without a lookup. Readable by anyone unless encrypted.","body":"\u003cp>A JWT (JSON Web Token) is a compact token containing JSON claims and a signature. It has three base64url-encoded parts separated by dots: \u003ccode>header.payload.signature\u003c/code>. A server holding the right key can verify the signature and trust the claims without a database lookup, which makes JWTs common for API \u003ca href=\"#Authentication\" data-term=\"Authentication\">authentication\u003c/a> and between services.\u003c/p>\u003cpre>\u003ccode>{ &quot;iss&quot;: &quot;https://auth.example.com&quot;, &quot;aud&quot;: &quot;orders-api&quot;, &quot;sub&quot;: &quot;user_42&quot;, &quot;exp&quot;: 1798765432 }\u003c/code>\u003c/pre>\u003cp>A standard signed JWT is encoded and not encrypted. Anyone holding the token can read its payload, so never put secrets or sensitive personal data in it. The signature only proves that the contents have not changed since a trusted key signed them.\u003c/p>\u003cp>Verification must check all of the following, preferably using a maintained library:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Check\u003c/th>\u003cth>Failure it prevents\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Signature\u003c/td>\u003ctd>Forged or edited tokens\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Allowed \u003ccode>alg\u003c/code>\u003c/td>\u003ctd>\u003ccode>none\u003c/code> tokens and confusion between public-key and shared-secret algorithms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>exp\u003c/code> and \u003ccode>nbf\u003c/code>\u003c/td>\u003ctd>Expired or not-yet-valid tokens\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>iss\u003c/code>\u003c/td>\u003ctd>Tokens from another issuer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>aud\u003c/code>\u003c/td>\u003ctd>A token issued for one service being replayed against another\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Configure the accepted algorithm on the server and never take it from the token's header. Decoding is not verifying: many libraries have a separate \u003ccode>decode\u003c/code> function that skips the signature entirely.\u003c/p>\u003cp>The main operational drawback is revocation. A signed token stays valid until \u003ccode>exp\u003c/code>, so a fired employee or a stolen token keeps working after you remove the account. Use short-lived access tokens, often minutes, with a revocable refresh token. A denylist of token IDs also works, but it brings back a per-request lookup.\u003c/p>\u003cp>For ordinary browser logins, a \u003ca href=\"#Session%20cookie\" data-term=\"Session cookie\">session cookie\u003c/a> is usually simpler and can be revoked immediately. If a browser must hold a JWT, avoid \u003ccode>localStorage\u003c/code>, which any injected script can read.\u003c/p>","avoid":"","usage":["We disabled her account an hour ago. Why can she still call the API?","Her JWT is valid until it expires. Shorten the access token lifetime and check revocation at refresh."],"out":[21,23]},{"name":"OAuth 2.0","section":2,"description":"A framework that lets an app access a user's resources on another service with a scoped token, without seeing their password.","body":"\u003cp>OAuth 2.0 is an \u003ca href=\"#Authorization\" data-term=\"Authorization\">authorization\u003c/a> framework that lets an application act on a user's resources at another service without receiving the user's password. A scheduling app can request access to your calendar, you approve it on the calendar provider's site, and the app receives a limited token. OAuth calls the parties the resource owner (user), client (app), authorization server (issues tokens) and resource server (the API).\u003c/p>\u003cp>For apps acting on behalf of a user, use the authorization code flow with PKCE (Proof Key for Code Exchange):\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Creates a secret \u003ccode>code_verifier\u003c/code>, a \u003ccode>state\u003c/code> value and a hash of the verifier\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Redirects the browser with scopes, \u003ccode>state\u003c/code> and the hash\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>User\u003c/td>\u003ctd>Logs in and approves\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Authorization server\u003c/td>\u003ctd>Redirects back with a short-lived, one-time code\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Checks \u003ccode>state\u003c/code>, then exchanges the code plus verifier for tokens\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Client\u003c/td>\u003ctd>Calls the API with the access token\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>PKCE ensures that an intercepted code cannot be redeemed without the verifier. The \u003ccode>state\u003c/code> value ties the response to the browser session that started it, which guards against \u003ca href=\"#CSRF\" data-term=\"CSRF\">CSRF\u003c/a>.\u003c/p>\u003cp>Register redirect URIs and match them exactly, because loose matching lets an attacker receive codes. Request the narrowest scopes. Keep client secrets and refresh tokens on the server. Do not use the implicit or password grants, which current guidance rules out. For service-to-service calls with no user, use the client credentials grant.\u003c/p>\u003cp>OAuth does not by itself tell an app who logged in. An access token is meant for the API and is not proof of identity. For sign-in, use \u003ca href=\"#OpenID%20Connect\" data-term=\"OpenID Connect\">OpenID Connect\u003c/a>. Access tokens may be opaque or a \u003ca href=\"#JWT\" data-term=\"JWT\">JWT\u003c/a>, and the client should not depend on their format.\u003c/p>","avoid":"","usage":["Can we just use the Google access token to log people in?","No, OAuth 2.0 access tokens aren't proof of login. Use OpenID Connect and validate the ID token."],"out":[22,31,26,24]},{"name":"OpenID Connect","section":2,"description":"An identity layer on OAuth 2.0 that adds a verifiable ID token, enabling sign-in through an external identity provider.","body":"\u003cp>OpenID Connect (OIDC) is an identity layer built on \u003ca href=\"#OAuth%202.0\" data-term=\"OAuth 2.0\">OAuth 2.0\u003c/a>. OAuth grants an app access to an API, while OIDC also tells the app who the user is. It powers &quot;Sign in with Google&quot; style logins and enterprise single sign-on, where one account works across many applications.\u003c/p>\u003cp>An app requests the \u003ccode>openid\u003c/code> scope during the OAuth code flow. Along with an access token, the identity provider returns an ID token, a \u003ca href=\"#JWT\" data-term=\"JWT\">JWT\u003c/a> containing claims about the login event.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Token\u003c/th>\u003cth>Audience\u003c/th>\u003cth>Used for\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ID token\u003c/td>\u003ctd>Your client app\u003c/td>\u003ctd>Establishing who logged in\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Access token\u003c/td>\u003ctd>The API\u003c/td>\u003ctd>Calling that API\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Refresh token\u003c/td>\u003ctd>Token endpoint\u003c/td>\u003ctd>Getting new tokens without login\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Do not swap their roles. Sending an ID token to an API as a bearer credential, or treating an access token as proof of login, breaks the audience checks that keep tokens from being misused.\u003c/p>\u003cp>Before starting a session, validate the ID token with a maintained library:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Check\u003c/th>\u003cth>Requirement\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Signature\u003c/td>\u003ctd>Verified against the provider's published keys\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>iss\u003c/code>\u003c/td>\u003ctd>Exactly matches the expected issuer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>aud\u003c/code>\u003c/td>\u003ctd>Contains your client ID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>exp\u003c/code>\u003c/td>\u003ctd>Has not passed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>nonce\u003c/code>\u003c/td>\u003ctd>Matches the value you sent, which blocks replayed tokens\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Identify users by the pair of \u003ccode>iss\u003c/code> and \u003ccode>sub\u003c/code>, and do not use the email address as the key. Emails change, can be reassigned, and may be unverified at some providers. Automatically merging accounts on a matching email is a known route to account takeover: an attacker registers the victim's address at a provider that does not verify it, then signs in as them.\u003c/p>\u003cp>After validation, the app normally creates its own \u003ca href=\"#Session%20cookie\" data-term=\"Session cookie\">session cookie\u003c/a>. Local \u003ca href=\"#Authorization\" data-term=\"Authorization\">authorization\u003c/a> remains your responsibility, since a valid login says nothing about what the user may do in your system.\u003c/p>","avoid":"","usage":["Two users share a profile after signing in with different providers.","We're matching on email. With OpenID Connect, key accounts on issuer plus \u003ccode>sub\u003c/code>."],"out":[25,24,23,22]},{"name":"RBAC","section":2,"description":"Role-based access control. Permissions are granted to roles, and users receive permissions by being assigned roles.","body":"\u003cp>RBAC (role-based access control) is an \u003ca href=\"#Authorization\" data-term=\"Authorization\">authorization\u003c/a> model where permissions are attached to roles and users are assigned roles. Instead of granting &quot;can refund orders&quot; to forty people individually, you grant it to \u003ccode>support_lead\u003c/code> and assign that role.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Role\u003c/th>\u003cth>\u003ccode>orders:read\u003c/code>\u003c/th>\u003cth>\u003ccode>orders:refund\u003c/code>\u003c/th>\u003cth>\u003ccode>users:manage\u003c/code>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>viewer\u003c/code>\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>support\u003c/code>\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>support_lead\u003c/code>\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>admin\u003c/code>\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Code should check permissions and not role names. A check such as \u003ccode>if user.role == &quot;admin&quot;\u003c/code> spreads through the codebase, and adding a new role later means finding every one of those conditions. \u003ccode>require(&quot;orders:refund&quot;)\u003c/code> keeps the mapping in one place, so a role can change without code changes.\u003c/p>\u003cp>In a product with multiple customers, a role assignment must be scoped to a tenant. A user may be \u003ccode>admin\u003c/code> in one organisation and \u003ccode>viewer\u003c/code> in another. If the role is stored globally on the user, an admin of a small test account can gain admin rights over everyone's data.\u003c/p>\u003cp>RBAC answers &quot;may this kind of user do this kind of thing?&quot; It does not on its own answer &quot;is this their invoice?&quot; You still need an object-level ownership check. The usual symptom of stretching it too far is role explosion: \u003ccode>manager_eu\u003c/code>, \u003ccode>manager_eu_readonly\u003c/code>, \u003ccode>manager_us_contractor\u003c/code>, until nobody can say what each role grants. That is a sign that the rule depends on attributes, which is the territory of \u003ca href=\"#ABAC\" data-term=\"ABAC\">ABAC\u003c/a>. Many systems use roles for broad access and attribute checks for the exceptions.\u003c/p>\u003cp>Apply least privilege: give the smallest role that does the job, review assignments regularly and remove them when people change teams. Log every role change, since it is a security-relevant event.\u003c/p>","avoid":"","usage":["We've got 140 roles and nobody knows what half of them do.","RBAC is being used to encode region and team. Keep a few roles and move those conditions into attribute rules."],"out":[22,28]},{"name":"ABAC","section":2,"description":"Attribute-based access control. Access is decided by policies evaluating properties of the user, resource, action and context.","body":"\u003cp>ABAC (attribute-based access control) is an \u003ca href=\"#Authorization\" data-term=\"Authorization\">authorization\u003c/a> model where a policy decides access by evaluating attributes. Those attributes describe four things: the subject (user), the resource, the action and the environment. A rule might read: &quot;A manager may approve an expense if it belongs to their department, is under their limit and was not submitted by them.&quot;\u003c/p>\u003cpre>\u003ccode>allow approve on expense if\n  user.department == expense.department\n  and expense.amount &lt;= user.approval_limit\n  and expense.submitter_id != user.id\u003c/code>\u003c/pre>\u003cp>Expressing this with \u003ca href=\"#RBAC\" data-term=\"RBAC\">RBAC\u003c/a> alone would need a role per department and limit, which is the role explosion that usually prompts teams to adopt ABAC.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>RBAC\u003c/th>\u003cth>ABAC\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Decision based on\u003c/td>\u003ctd>Assigned roles\u003c/td>\u003ctd>Attributes and policy rules\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Granularity\u003c/td>\u003ctd>Coarse\u003c/td>\u003ctd>Fine, down to individual records\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Answering &quot;who can access this?&quot;\u003c/td>\u003ctd>Read role assignments\u003c/td>\u003ctd>Must evaluate policies against users\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Implementation effort\u003c/td>\u003ctd>Lower\u003c/td>\u003ctd>Higher\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Good fit\u003c/td>\u003ctd>Stable job functions\u003c/td>\u003ctd>Ownership, region, time or data class\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>ABAC is only as trustworthy as its attributes. If a user can edit their own \u003ccode>department\u003c/code> through a profile endpoint, they can grant themselves access, so attributes used in decisions must come from a trusted source. Treat a failed attribute lookup or an unmatched rule as a denial.\u003c/p>\u003cp>List endpoints are the usual implementation difficulty. Loading every row and filtering it in application code is slow and risks leaking data through counts or \u003ca href=\"#Pagination\" data-term=\"Pagination\">pagination\u003c/a>. The policy needs to be translated into a query filter, which some policy engines support directly.\u003c/p>\u003cp>Policy engines such as Open Policy Agent and Cedar keep rules outside application code, so they can be reviewed and tested. Because a small policy edit can widen access silently, add tests for allowed and denied cases and log each decision.\u003c/p>","avoid":"","usage":["Managers should only approve expenses from their own team, and never their own.","That doesn't fit a role. Write it as an ABAC policy on department and submitter."],"out":[22,27,15]},{"name":"API key","section":2,"description":"A long random secret that identifies a calling application or account, used for server-to-server access to an API.","body":"\u003cp>An API key is a long random secret that a program sends to identify itself to an API. It is commonly used for server-to-server integrations and scripts, where no person is present to complete a login. A key provides simple \u003ca href=\"#Authentication\" data-term=\"Authentication\">authentication\u003c/a> of the calling project or account, and it usually stays valid until someone revokes it. That long lifetime makes leaks serious.\u003c/p>\u003cp>Key handling by stage:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>What to do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Create\u003c/td>\u003ctd>Generate at least 128 random bits with a cryptographically secure generator\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Display\u003c/td>\u003ctd>Show the full key once, and keep only a short prefix for identification\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Store\u003c/td>\u003ctd>Save a hash of the key, never the plaintext\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Send\u003c/td>\u003ctd>Use a request header, over \u003ca href=\"#TLS\" data-term=\"TLS\">TLS\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Limit\u003c/td>\u003ctd>Apply scopes, per-key rate limits and optional IP restrictions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rotate\u003c/td>\u003ctd>Allow two active keys so clients can switch without downtime\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Revoke\u003c/td>\u003ctd>Disable immediately and record last-used time\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Never put keys in URLs. Query strings end up in access logs, browser history, proxies and \u003ccode>Referer\u003c/code> headers. Never embed one in frontend or mobile code either, since anyone can extract it from the bundle.\u003c/p>\u003cp>Because generated keys have high entropy, a fast hash such as SHA-256 is acceptable for storage, unlike human-chosen passwords, which need slow \u003ca href=\"#Password%20hashing\" data-term=\"Password hashing\">password hashing\u003c/a>.\u003c/p>\u003cp>A recognisable prefix, such as \u003ccode>acme_live_\u003c/code>, helps people tell test keys from live keys and lets secret-scanning tools detect leaks. If a key is committed to a repository, revoke it.\u003c/p>\u003cp>An API key identifies an application and not a person. For actions on behalf of individual users, use \u003ca href=\"#OAuth%202.0\" data-term=\"OAuth 2.0\">OAuth 2.0\u003c/a>. Apply \u003ca href=\"#Authorization\" data-term=\"Authorization\">authorization\u003c/a> to every key, so a read-only integration cannot write.\u003c/p>","avoid":"","usage":["Someone pushed our API key to a public repo, but I've already removed the commit.","That doesn't help. Assume it's compromised, so revoke it, issue a new one and check its usage logs."],"out":[21,6,30,25,22]},{"name":"Password hashing","section":2,"description":"Storing passwords through a slow, salted, one-way function so a stolen database does not reveal them.","body":"\u003cp>Password hashing is storing the output of a slow, salted, one-way function in place of the password itself. At login, the server applies the same function to the submitted password and compares results. If the database leaks, attackers still have to guess each password individually.\u003c/p>\u003cp>The function is one-way, so the output cannot be reversed. A salt, a random value unique to each password and stored beside the hash, means identical passwords produce different hashes and precomputed tables are useless. The function is deliberately expensive, which limits how many guesses per second an attacker can make.\u003c/p>\u003cp>General-purpose hashes such as MD5, SHA-1 and SHA-256 are designed to be fast, so they are the wrong tool here, even with a salt. Encryption is also wrong, since anyone who obtains the key can recover every password.\u003c/p>\u003cp>OWASP's password storage guidance lists these minimum settings, which you should recheck periodically:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Algorithm\u003c/th>\u003cth>Minimum configuration\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Argon2id\u003c/td>\u003ctd>19 MiB memory, 2 iterations, p=1\u003c/td>\u003ctd>First choice\u003c/td>\u003c/tr>\u003ctr>\u003ctd>scrypt\u003c/td>\u003ctd>N=2^17, r=8, p=1\u003c/td>\u003ctd>Use if Argon2id is unavailable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bcrypt\u003c/td>\u003ctd>Work factor 10 or more\u003c/td>\u003ctd>Input limited to 72 bytes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PBKDF2-HMAC-SHA256\u003c/td>\u003ctd>600,000 iterations\u003c/td>\u003ctd>For FIPS-compliance needs\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Use a maintained library and its verify function, which handles salts and constant-time comparison. Its encoded output records the algorithm and parameters, so you can raise the cost later and rehash at the next successful login.\u003c/p>\u003cp>Slow hashing has a server-side cost. A burst of login attempts can saturate the CPU and, in a single-threaded runtime, stall the \u003ca href=\"#Event%20loop\" data-term=\"Event loop\">event loop\u003c/a> for every user. Rate-limit login, run hashing off the main \u003ca href=\"#Thread\" data-term=\"Thread\">thread\u003c/a>, and set a generous maximum password length so very long inputs cannot be used for denial of service.\u003c/p>","avoid":"","usage":["The audit flagged our password column. It's SHA-256 with a salt, isn't that fine?","No, it's too fast. Move to Argon2id password hashing and rehash each user at next login."],"out":[38,36]},{"name":"CSRF","section":2,"description":"An attack where a malicious site makes a victim's browser send an authenticated request, using cookies it attaches automatically.","body":"\u003cp>CSRF (cross-site request forgery) is an attack where a malicious website causes a victim's browser to send a request to another site where they are logged in. Browsers can attach cookies automatically, so the target receives a request carrying a valid \u003ca href=\"#Session%20cookie\" data-term=\"Session cookie\">session cookie\u003c/a> and treats it as genuine. The attacker cannot read the response, but the action still happens.\u003c/p>\u003cpre>\u003ccode>&lt;form action=&quot;https://bank.example/transfer&quot; method=&quot;POST&quot;&gt;\n  &lt;input type=&quot;hidden&quot; name=&quot;to&quot; value=&quot;attacker&quot; /&gt;\n  &lt;input type=&quot;hidden&quot; name=&quot;amount&quot; value=&quot;500&quot; /&gt;\n&lt;/form&gt;\n&lt;script&gt;document.forms[0].submit()&lt;/script&gt;\u003c/code>\u003c/pre>\u003cp>Layer these defences for cookie-authenticated, state-changing routes:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Defence\u003c/th>\u003cth>How it works\u003c/th>\u003cth>Limit\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Anti-CSRF token\u003c/td>\u003ctd>Server checks an unpredictable per-session token on each write\u003c/td>\u003ctd>Must cover every state-changing route\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>SameSite=Lax\u003c/code> or \u003ccode>Strict\u003c/code>\u003c/td>\u003ctd>Browser withholds the cookie on cross-site POSTs\u003c/td>\u003ctd>Sibling subdomains count as same-site\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Origin\u003c/code> / \u003ccode>Sec-Fetch-Site\u003c/code>\u003c/td>\u003ctd>Server rejects requests from untrusted origins\u003c/td>\u003ctd>Decide how to treat a missing header\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Correct \u003ca href=\"#HTTP%20method\" data-term=\"HTTP method\">HTTP methods\u003c/a>\u003c/td>\u003ctd>GET never changes state\u003c/td>\u003ctd>\u003ccode>Lax\u003c/code> still sends cookies on top-level GET\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Set \u003ccode>SameSite\u003c/code> explicitly and do not rely on browser defaults, which vary. Use your framework's built-in protection where it exists, since a common failure is a developer disabling it after hitting a &quot;CSRF token missing&quot; error on a form.\u003c/p>\u003cp>CORS (the browser rules for cross-origin reads) is not a CSRF defence. It controls whether a page can read a response, and a simple cross-site form POST is still sent.\u003c/p>\u003cp>APIs that authenticate only with an \u003ccode>Authorization\u003c/code> header are generally not exposed to CSRF, because browsers do not attach that header automatically. Cross-site scripting defeats these protections, since attacker code running on your page can read tokens and make same-origin requests. Protect login forms as well, because login CSRF can sign a victim into the attacker's account.\u003c/p>","avoid":"","usage":["This POST fails with 'CSRF token missing'. Can I exempt the route?","No, it changes account settings. Send the token from the form instead of turning off CSRF protection."],"out":[23,1]},{"name":"SQL injection","section":2,"description":"An attack where input is interpreted as part of a SQL statement. Prevented by passing values as bound parameters.","body":"\u003cp>SQL injection is a vulnerability where untrusted input becomes part of the text of a database query, so the database runs it as code. It can expose or alter data and bypass login, and on some configurations it can reach the underlying server. An early, harmless sign is a search or signup form that returns a 500 when someone named O'Brien uses it: the apostrophe has ended the string in the query.\u003c/p>\u003cpre>\u003ccode># Vulnerable: input is concatenated into the statement\ndb.execute(f&quot;SELECT * FROM users WHERE email = '{email}'&quot;)\n\n# Safe: the value is sent separately as a bound parameter\ndb.execute(&quot;SELECT * FROM users WHERE email = %s&quot;, (email,))\u003c/code>\u003c/pre>\u003cp>With a parameterized query, the driver or database treats the value strictly as data, whatever characters it contains. This is the primary defence. Manual escaping and blocklists of words such as \u003ccode>DROP\u003c/code> are unreliable and should not be used in its place.\u003c/p>\u003cp>Parameters do not cover every part of a query:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Query part\u003c/th>\u003cth>Safe approach\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Values\u003c/td>\u003ctd>Bound parameters\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Column or table names\u003c/td>\u003ctd>Map user input to a hardcoded allowlist\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sort direction\u003c/td>\u003ctd>Allow only \u003ccode>ASC\u003c/code> or \u003ccode>DESC\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>IN (...)\u003c/code> lists\u003c/td>\u003ctd>Generate one placeholder per value, or bind an array\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Raw queries in an \u003ca href=\"#ORM\" data-term=\"ORM\">ORM\u003c/a>\u003c/td>\u003ctd>Use the ORM's parameter binding, never interpolation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dynamic SQL in stored procedures\u003c/td>\u003ctd>Bind parameters there too\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>An ORM protects its normal query methods, but its raw-query features can still be injected. Stored data can also be dangerous: in second-order injection, a value saved safely is later concatenated into another query, so treat values read from your own database as untrusted too.\u003c/p>\u003cp>Add defence in depth. Connect with a database account holding the least privileges it needs, so that an injection cannot drop tables. Return generic error messages, since raw database errors help attackers refine a payload. Input validation is useful but does not replace parameters.\u003c/p>","avoid":"","usage":["Search crashes whenever the term contains an apostrophe.","That's SQL injection waiting to happen. Replace the string formatting with a bound parameter."],"out":[54]},{"name":"SSRF","section":2,"description":"An attack that tricks your server into requesting a URL of the attacker's choice, often reaching internal systems.","body":"\u003cp>SSRF (server-side request forgery) is a vulnerability where an attacker makes your server send a request to a destination they choose. It appears in features that fetch a user-supplied URL: link previews, image imports, PDF generators and \u003ca href=\"#Webhook\" data-term=\"Webhook\">webhook\u003c/a> destinations. The request originates inside your network, so it can reach things the attacker cannot reach directly, including admin panels, internal APIs and cloud metadata endpoints.\u003c/p>\u003cp>Many cloud platforms expose instance information at the link-local address \u003ccode>169.254.169.254\u003c/code>, sometimes including temporary credentials. If an &quot;import image from URL&quot; feature fetches that address and returns the body, the attacker may obtain those credentials.\u003c/p>\u003cp>Blocklisting strings such as \u003ccode>localhost\u003c/code> is not sufficient. Attackers can use alternate IP encodings, IPv6 forms, a DNS name resolving to an internal address, or a public URL that redirects inward. Apply layered controls:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Control\u003c/th>\u003cth>What to do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Allowlist\u003c/td>\u003ctd>Permit only known hosts wherever the feature allows it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scheme and port\u003c/td>\u003ctd>Allow only \u003ccode>https\u003c/code>, or \u003ccode>http\u003c/code> if required, on expected ports\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Resolved IP check\u003c/td>\u003ctd>Resolve the name and reject private, loopback, link-local and mapped addresses\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pin the connection\u003c/td>\u003ctd>Connect to the validated IP, which prevents DNS rebinding\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Redirects\u003c/td>\u003ctd>Disable them, or revalidate every hop\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Network egress\u003c/td>\u003ctd>Run fetchers in an isolated network with outbound rules\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Metadata hardening\u003c/td>\u003ctd>Require session-based metadata access, such as AWS IMDSv2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Response handling\u003c/td>\u003ctd>Enforce size and time limits, and do not return raw bodies or errors\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>DNS rebinding is why checking a URL once is not enough: the name resolves to a public address during validation and an internal one at fetch time.\u003c/p>\u003cp>Return one generic failure, since differing errors let attackers map internal ports. Internal services should still require \u003ca href=\"#Authentication\" data-term=\"Authentication\">authentication\u003c/a> instead of trusting a request because it came from inside.\u003c/p>","avoid":"","usage":["The link preview fetched \u003ccode>169.254.169.254\u003c/code> during the pen test.","That's SSRF. Validate the resolved IP, pin the connection and block redirects."],"out":[20,21]},{"name":"Concurrency","section":3,"description":"Structuring a program so several tasks are in progress over the same period, whether or not they run at the same instant.","body":"\u003cp>Concurrency is structuring a program so that several tasks are in progress during the same period. The tasks may take turns on a single CPU core, which distinguishes it from \u003ca href=\"#Parallelism\" data-term=\"Parallelism\">parallelism\u003c/a>, where tasks execute at the same instant. A server needs concurrency because requests overlap: while one waits for a database response, another can use the CPU.\u003c/p>\u003cp>Languages and runtimes offer different models:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Model\u003c/th>\u003cth>Who switches tasks\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>OS \u003ca href=\"#Thread\" data-term=\"Thread\">threads\u003c/a>\u003c/td>\u003ctd>Operating system, at any moment\u003c/td>\u003ctd>Java platform threads, C++\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Runtime-managed threads\u003c/td>\u003ctd>Language runtime\u003c/td>\u003ctd>Goroutines, Java virtual threads\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Event%20loop\" data-term=\"Event loop\">Event loop\u003c/a> tasks\u003c/td>\u003ctd>Tasks yield at \u003ca href=\"#Async-await\" data-term=\"Async-await\">await\u003c/a> points\u003c/td>\u003ctd>Node.js, Python asyncio\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Multiple processes\u003c/td>\u003ctd>Operating system, memory isolated\u003c/td>\u003ctd>Pre-fork web servers\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Concurrency helps most when work spends its time waiting, such as on network calls, disk access or a database. It does little for a task that uses the CPU continuously, because there is no idle time for another task to use.\u003c/p>\u003cp>The difficulty comes from shared state. When tasks overlap, their steps can interleave in orders you did not plan for. That produces the typical concurrency bug: code passes every test with one user, then under load a counter comes up short or two customers book the same seat. Such a \u003ca href=\"#Race%20condition\" data-term=\"Race condition\">race condition\u003c/a> may appear only rarely, which makes it hard to reproduce.\u003c/p>\u003cp>Protecting shared data with a \u003ca href=\"#Mutex\" data-term=\"Mutex\">mutex\u003c/a> solves that but adds waiting, and careless locking can produce a \u003ca href=\"#Deadlock\" data-term=\"Deadlock\">deadlock\u003c/a>. Where possible, avoid sharing mutable state, or let the database enforce the rule atomically.\u003c/p>\u003cp>Limit concurrency as well. Launching one task per item in a list of 100,000 can exhaust connections, memory or a partner's rate limit. A \u003ca href=\"#Thread%20pool\" data-term=\"Thread pool\">thread pool\u003c/a> or semaphore (a counter capping simultaneous tasks) keeps the number bounded.\u003c/p>","avoid":"","usage":["It works perfectly when I test it, but production totals are a few cents off.","That sounds like a concurrency bug. Two requests are probably updating the same balance at once."],"out":[35,36,38,40,41,42,43,37]},{"name":"Parallelism","section":3,"description":"Executing multiple computations at the same instant on separate CPU cores to finish CPU-heavy work sooner.","body":"\u003cp>Parallelism is executing multiple computations at the same instant on separate CPU cores. It is often confused with \u003ca href=\"#Concurrency\" data-term=\"Concurrency\">concurrency\u003c/a>, which is about managing overlapping tasks. A single-core machine can be concurrent by switching between tasks, but it cannot be parallel.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Situation\u003c/th>\u003cth>Concurrent\u003c/th>\u003cth>Parallel\u003c/th>\u003cth>What helps\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1,000 requests waiting on network\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Not needed\u003c/td>\u003ctd>\u003ca href=\"#Async-await\" data-term=\"Async-await\">Async-await\u003c/a> or many \u003ca href=\"#Thread\" data-term=\"Thread\">threads\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Resizing images on 8 cores\u003c/td>\u003ctd>Possibly\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>One task per core\u003c/td>\u003c/tr>\u003ctr>\u003ctd>One long sequential calculation\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003ctd>A faster algorithm\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Parallelism speeds up CPU-bound work, meaning work limited by computation rather than waiting. Adding cores to an I/O-bound service often changes little, because its time is spent waiting on something else.\u003c/p>\u003cp>Speedup has a limit. Amdahl's law states that the serial portion of a program caps the benefit of adding processors. If 10% of a job must run sequentially, it can never go more than ten times faster, however many cores you add. Coordination, such as waiting on a \u003ca href=\"#Mutex\" data-term=\"Mutex\">mutex\u003c/a>, adds further cost, and past some point more threads can make a program slower.\u003c/p>\u003cp>Runtimes differ in what they allow. Node.js runs JavaScript on one main thread, so CPU-heavy work needs \u003ccode>worker_threads\u003c/code> or separate processes. CPython's standard build has a global interpreter lock that stops threads running Python code simultaneously, so CPU-bound Python typically uses multiple processes. Optional free-threaded builds have been available since Python 3.13. Go and Java run threads across cores by default.\u003c/p>\u003cp>Containers add a common surprise. A runtime that sizes itself from the host's core count may start far more threads than its CPU limit allows, and the container gets throttled, showing latency spikes while average CPU looks moderate. Check that pool sizes reflect the container's limit.\u003c/p>","avoid":"","usage":["We doubled the cores and the API didn't get any faster.","It's I/O-bound. Parallelism won't help when every request is waiting on the same database."],"out":[34,40,36,42]},{"name":"Thread","section":3,"description":"An independent path of execution inside a process, with its own stack but sharing the process's memory with other threads.","body":"\u003cp>A thread is an independent path of execution inside a process. Each thread has its own stack and instruction position, while all threads in a process share the same heap memory and open files. Sharing makes communication between them easy and is also the source of most \u003ca href=\"#Concurrency\" data-term=\"Concurrency\">concurrency\u003c/a> bugs.\u003c/p>\u003cp>The operating system's scheduler decides which threads run and can pause one at nearly any instruction. On a multi-core machine, several run at once, giving \u003ca href=\"#Parallelism\" data-term=\"Parallelism\">parallelism\u003c/a>. Even a single line such as \u003ccode>count += 1\u003c/code> is usually several machine steps, so another thread can run between them and cause a \u003ca href=\"#Race%20condition\" data-term=\"Race condition\">race condition\u003c/a>.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Unit\u003c/th>\u003cth>Scheduled by\u003c/th>\u003cth>Memory\u003c/th>\u003cth>Relative cost\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Process\u003c/td>\u003ctd>Operating system\u003c/td>\u003ctd>Isolated\u003c/td>\u003ctd>Highest\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OS thread\u003c/td>\u003ctd>Operating system\u003c/td>\u003ctd>Shared within process\u003c/td>\u003ctd>Medium\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Virtual thread or goroutine\u003c/td>\u003ctd>Language runtime\u003c/td>\u003ctd>Shared, small growable stack\u003c/td>\u003ctd>Low\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The traditional server model gives each request its own thread. It is easy to reason about, because code runs top to bottom and \u003ca href=\"#Blocking%20IO\" data-term=\"Blocking IO\">blocking I/O\u003c/a> only pauses that one thread. Its limit is cost. Each OS thread reserves stack space, and switching between many of them consumes CPU time. A service creating one thread per connection can fail during a traffic spike with an error such as Java's \u003ccode>unable to create native thread\u003c/code>, even though the CPU is barely busy.\u003c/p>\u003cp>Servers therefore reuse a fixed set through a \u003ca href=\"#Thread%20pool\" data-term=\"Thread pool\">thread pool\u003c/a>, or use lighter units such as goroutines and Java virtual threads.\u003c/p>\u003cp>Threads in a process share its failures. An uncaught fatal error or memory corruption in one can bring down the entire process. When a service hangs, a thread dump, a snapshot of what each thread is doing, is usually the first diagnostic to take.\u003c/p>","avoid":"","usage":["The service stopped responding, but CPU is at 2%.","Take a thread dump. If every thread is parked on the same call, we've found what's holding them up."],"out":[34,35,41,39,37]},{"name":"Thread pool","section":3,"description":"A fixed set of reusable threads that take tasks from a queue, bounding how much work a server runs at once.","body":"\u003cp>A \u003ca href=\"#Thread\" data-term=\"Thread\">thread\u003c/a> pool is a set of long-lived threads that take tasks from a queue and run them. Reusing threads avoids the cost of creating one per task, and the fixed size caps how much work runs at the same time.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Caller\u003c/td>\u003ctd>Submits a task\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Pool\u003c/td>\u003ctd>Assigns it to an idle thread, or places it in the queue\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Thread\u003c/td>\u003ctd>Runs the task to completion\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Thread\u003c/td>\u003ctd>Returns to the pool and takes the next task\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Pool\u003c/td>\u003ctd>Rejects the task if the queue is full\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>The characteristic failure is pool exhaustion. One slow dependency makes every thread wait on it, new requests pile up in the queue, and the entire service appears hung while CPU sits near idle. Endpoints that do not touch the slow dependency also time out, because they cannot get a thread. Set timeouts on every outbound call, and give risky dependencies their own small pool.\u003c/p>\u003cp>Sizing depends on the work. For CPU-bound tasks, start near the number of cores. For tasks that mostly wait on I/O, a larger pool makes sense, but keep it consistent with downstream limits: 200 threads sharing 20 database connections will queue for connections instead.\u003c/p>\u003cp>Bound the queue. An unbounded queue hides overload until memory runs out, and requests wait so long that clients have already given up. Rejecting early with a 503 \u003ca href=\"#Status%20code\" data-term=\"Status code\">status code\u003c/a> is usually better.\u003c/p>\u003cp>A task that submits a subtask to the same pool and waits for it can cause a \u003ca href=\"#Deadlock\" data-term=\"Deadlock\">deadlock\u003c/a> when all threads are doing this. Because threads are reused, thread-local data left by one request, such as a user ID, can leak into the next unless it is cleared.\u003c/p>","avoid":"","usage":["Even the health check is timing out, and the CPU is idle.","The thread pool's exhausted. Every thread is stuck on that payment call because it has no timeout."],"out":[36,2,43]},{"name":"Event loop","section":3,"description":"A loop that waits for ready events and runs their callbacks on one thread, letting it serve many connections that mostly wait.","body":"\u003cp>An event loop is a loop that waits for events, such as data arriving on a socket, and runs the code registered for each one. It lets a single \u003ca href=\"#Thread\" data-term=\"Thread\">thread\u003c/a> serve thousands of connections, because a connection that is waiting for data costs no thread. Node.js, Python's asyncio, Nginx and Redis are built around this design.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Application\u003c/td>\u003ctd>Starts an I/O operation and registers what to do on completion\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Event loop\u003c/td>\u003ctd>Continues with other ready work\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>OS\u003c/td>\u003ctd>Reports ready sockets through a mechanism such as epoll or kqueue\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Event loop\u003c/td>\u003ctd>Queues the matching callback or resumes the paused task\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Event loop\u003c/td>\u003ctd>Runs it until it finishes or yields, then repeats\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Scheduling is cooperative: nothing interrupts running code. A task keeps the thread until it returns or reaches an \u003ccode>await\u003c/code> in \u003ca href=\"#Async-await\" data-term=\"Async-await\">async-await\u003c/a> code. The main failure follows from this: one slow operation freezes every other request in the process. A 2-second \u003ccode>JSON.parse\u003c/code> on a large payload, a synchronous file read, an expensive regular expression or \u003ca href=\"#Password%20hashing\" data-term=\"Password hashing\">password hashing\u003c/a> on the main thread means all users wait 2 seconds.\u003c/p>\u003cp>The symptom is latency rising across all endpoints at once, with one CPU core at 100%. Measure event loop lag, the delay between when a callback was due and when it ran.\u003c/p>\u003cp>To keep the loop responsive, avoid \u003ca href=\"#Blocking%20IO\" data-term=\"Blocking IO\">blocking I/O\u003c/a> on it. Move CPU-heavy work to a separate thread, a separate process or a \u003ca href=\"#Background%20job\" data-term=\"Background job\">background job\u003c/a>. Limit request body sizes and split long computations.\u003c/p>\u003cp>&quot;Single-threaded&quot; describes the part that runs your code. Node.js also uses a small internal \u003ca href=\"#Thread%20pool\" data-term=\"Thread pool\">thread pool\u003c/a> for some file, DNS lookup and crypto operations. It has four threads by default, so those operations can queue behind each other.\u003c/p>","avoid":"","usage":["Every endpoint spikes whenever someone downloads the big report.","The report builder runs on the event loop and blocks it. Move it off the main thread."],"out":[36,40,30,39,44,37]},{"name":"Blocking IO","section":3,"description":"An input or output call that stops the calling thread until it completes, leaving that thread unable to do anything else.","body":"\u003cp>Blocking I/O is an input or output operation that suspends the calling \u003ca href=\"#Thread\" data-term=\"Thread\">thread\u003c/a> until it completes. A call such as \u003ccode>read()\u003c/code> on a socket does not return until data arrives. While it waits, the thread uses almost no CPU, but it cannot do anything else. Network calls, disk access and database queries are the usual examples.\u003c/p>\u003cp>Non-blocking I/O returns control immediately, and the program learns later that the operation has finished.\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Blocking\u003c/th>\u003cth>Non-blocking\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Code style\u003c/td>\u003ctd>Sequential and easy to read\u003c/td>\u003ctd>\u003ca href=\"#Async-await\" data-term=\"Async-await\">Async-await\u003c/a>, callbacks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Waiting costs\u003c/td>\u003ctd>One thread per in-flight call\u003c/td>\u003ctd>A small record per in-flight call\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Typical server\u003c/td>\u003ctd>\u003ca href=\"#Thread%20pool\" data-term=\"Thread pool\">Thread pool\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"#Event%20loop\" data-term=\"Event loop\">Event loop\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Main risk\u003c/td>\u003ctd>Running out of threads\u003c/td>\u003ctd>One blocking call stalls everyone\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Blocking is fine in a threaded server, provided the pool is sized for it and every call has a timeout. Without a timeout, a dependency that stops answering holds its thread indefinitely, and enough of those calls will exhaust the pool.\u003c/p>\u003cp>The damaging case is a blocking call inside an event loop. In Node.js, \u003ccode>fs.readFileSync\u003c/code> stops every request in the process while it runs. In Python, calling \u003ccode>time.sleep()\u003c/code> or the synchronous \u003ccode>requests\u003c/code> library inside an \u003ccode>async def\u003c/code> handler freezes the loop in the same way. The code looks correct and passes tests with one user, then throughput collapses under load because requests are handled one at a time.\u003c/p>\u003cp>To fix it, use the async version of the library, or move the call to a separate thread, for example with \u003ccode>asyncio.to_thread\u003c/code> in Python.\u003c/p>\u003cp>Not all I/O has a non-blocking form on every platform. Regular file reads on Linux generally block even when a descriptor is marked non-blocking, so runtimes such as Node.js hand file operations to helper threads.\u003c/p>","avoid":"","usage":["Why does one slow upload stall the whole FastAPI app?","That \u003ccode>async def\u003c/code> handler does blocking I/O with \u003ccode>requests\u003c/code>. Use an async client or run it in a thread."],"out":[36,40,37,38]},{"name":"Async-await","section":3,"description":"Language syntax for writing non-blocking code in sequential style, pausing a function at each await until its result is ready.","body":"\u003cp>Async-await is language syntax for writing non-blocking code that reads like sequential code. An \u003ccode>async\u003c/code> function can pause at each \u003ccode>await\u003c/code>, handing control back to the scheduler, and resume when the awaited operation completes. JavaScript, Python, C# and Rust all provide it. Usually an \u003ca href=\"#Event%20loop\" data-term=\"Event loop\">event loop\u003c/a> or similar runtime does the scheduling.\u003c/p>\u003cpre>\u003ccode>async function getOrder(id) {\n  const order = await db.findOrder(id); // other tasks run during this wait\n  const user = await db.findUser(order.userId);\n  return { order, user };\n}\u003c/code>\u003c/pre>\u003cp>The compiler or runtime turns such a function into a resumable state machine, so a paused function holds no \u003ca href=\"#Thread\" data-term=\"Thread\">thread\u003c/a>. This gives \u003ca href=\"#Concurrency\" data-term=\"Concurrency\">concurrency\u003c/a> for I/O-bound work. It does not make CPU-heavy code faster or run it in \u003ca href=\"#Parallelism\" data-term=\"Parallelism\">parallel\u003c/a>.\u003c/p>\u003cp>Common mistakes have recognisable symptoms:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mistake\u003c/th>\u003cth>Symptom\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Forgotten \u003ccode>await\u003c/code>\u003c/td>\u003ctd>Code continues early, errors vanish or go unhandled\u003c/td>\u003ctd>Enable a lint rule for floating promises\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Awaiting in a loop\u003c/td>\u003ctd>20 independent calls run one after another\u003c/td>\u003ctd>\u003ccode>Promise.all\u003c/code>, \u003ccode>asyncio.gather\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unbounded \u003ccode>Promise.all\u003c/code>\u003c/td>\u003ctd>10,000 calls at once exhaust connections\u003c/td>\u003ctd>Add a concurrency limit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#Blocking%20IO\" data-term=\"Blocking IO\">Blocking I/O\u003c/a> in an async function\u003c/td>\u003ctd>Every request stalls\u003c/td>\u003ctd>Use an async client or a separate thread\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fire-and-forget task\u003c/td>\u003ctd>Work is lost on restart, failures go unseen\u003c/td>\u003ctd>Use a \u003ca href=\"#Background%20job\" data-term=\"Background job\">background job\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A common misconception is that single-threaded async code cannot have a \u003ca href=\"#Race%20condition\" data-term=\"Race condition\">race condition\u003c/a>. It can. Other tasks run at every \u003ccode>await\u003c/code>, so a sequence that reads a balance, awaits something, then writes the balance can interleave with another request doing the same. Keep check-and-update logic free of awaits, or make it atomic in the database.\u003c/p>\u003cp>Async also spreads through a codebase: a function that awaits must generally be async itself, and so must its callers. This is why mixing sync and async libraries takes planning.\u003c/p>","avoid":"","usage":["The endpoint makes five API calls and takes five seconds.","You're using async-await one call at a time. They're independent, so run them with \u003ccode>Promise.all\u003c/code>."],"out":[38,36,34,35,39,44,41]},{"name":"Race condition","section":3,"description":"A bug where the result depends on the timing of overlapping operations, so it appears only under particular interleavings.","body":"\u003cp>A race condition is a bug where the outcome depends on the timing of overlapping operations. The code is correct when steps run one after another and wrong when they interleave. It explains failures such as an oversold last ticket, a coupon redeemed twice, or a counter that ends up lower than the number of requests. These bugs often pass tests and appear only under production load, because \u003ca href=\"#Concurrency\" data-term=\"Concurrency\">concurrency\u003c/a> is what exposes them.\u003c/p>\u003cp>One common form is a lost update:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Request A\u003c/th>\u003cth>Request B\u003c/th>\u003cth>Stored balance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Reads 100\u003c/td>\u003ctd>\u003c/td>\u003ctd>100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003c/td>\u003ctd>Reads 100\u003c/td>\u003ctd>100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Writes 100 - 30\u003c/td>\u003ctd>\u003c/td>\u003ctd>70\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003c/td>\u003ctd>Writes 100 - 50\u003c/td>\u003ctd>50\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Both requests succeeded, 80 was withdrawn, and the balance shows only 50 removed. The other common form is check-then-act: two requests both check that a username is free, both see that it is, and both create it. When the gap involves a security check, it is called time-of-check to time-of-use (TOCTOU).\u003c/p>\u003cp>Fixes, in rough order of preference:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Approach\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Atomic operation\u003c/td>\u003ctd>\u003ccode>UPDATE accounts SET balance = balance - 30 WHERE id = 1 AND balance &gt;= 30\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Database constraint\u003c/td>\u003ctd>A unique index on \u003ccode>username\u003c/code>, with the conflict handled\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Optimistic check\u003c/td>\u003ctd>Update only if a version column is unchanged, else retry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lock\u003c/td>\u003ctd>A \u003ca href=\"#Mutex\" data-term=\"Mutex\">mutex\u003c/a> or a row lock around the critical steps\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Remove sharing\u003c/td>\u003ctd>Process each account's work through one ordered queue\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>An in-process mutex protects only that process. With several server instances, two requests can hold &quot;the&quot; lock at the same time on different machines, so the rule must be enforced in a shared system such as the database.\u003c/p>\u003cp>Single-threaded runtimes are not immune, because tasks interleave at each \u003ccode>await\u003c/code> in \u003ca href=\"#Async-await\" data-term=\"Async-await\">async-await\u003c/a> code.\u003c/p>","avoid":"","usage":["We sold 102 tickets for a 100-seat venue.","That's a race condition in the availability check. Make the decrement atomic and conditional on remaining seats."],"out":[34,42,40]},{"name":"Mutex","section":3,"description":"A lock that allows only one thread at a time into a section of code, protecting shared data from concurrent access.","body":"\u003cp>A mutex (mutual exclusion lock) is a synchronization primitive that lets only one \u003ca href=\"#Thread\" data-term=\"Thread\">thread\u003c/a> at a time run a protected section of code. A thread locks it before touching shared data and unlocks it afterwards. Any other thread attempting to lock it waits. The protected code is called the critical section, and a mutex is a standard fix for a \u003ca href=\"#Race%20condition\" data-term=\"Race condition\">race condition\u003c/a> on in-memory state.\u003c/p>\u003cpre>\u003ccode>mu.Lock()\ndefer mu.Unlock() // released on every return path\nbalance -= amount\u003c/code>\u003c/pre>\u003cp>Release the lock on every path, using \u003ccode>defer\u003c/code>, \u003ccode>finally\u003c/code> or a scoped guard. If an exception skips the unlock, every later caller waits forever and that code path hangs.\u003c/p>\u003cp>Locks have a performance cost when contended. Since only one thread can hold the mutex, a busy critical section turns parallel work into a single-file line. The symptom is latency that climbs with load while CPU stays low, because threads spend their time waiting.\u003c/p>\u003cp>Practical rules:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Rule\u003c/th>\u003cth>Reason\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Keep the critical section short\u003c/td>\u003ctd>Reduces waiting\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Do not do network or disk calls inside\u003c/td>\u003ctd>One slow call stalls every thread needing the lock\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lock consistently\u003c/td>\u003ctd>One unprotected read or write is still a data race\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Acquire several locks in a fixed order\u003c/td>\u003ctd>Prevents a \u003ca href=\"#Deadlock\" data-term=\"Deadlock\">deadlock\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Do not re-lock unless it is reentrant\u003c/td>\u003ctd>Go's \u003ccode>sync.Mutex\u003c/code> deadlocks if the holder locks it again\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A read-write lock lets many readers in together but gives a writer exclusive access. A reentrant lock, such as Java's \u003ccode>synchronized\u003c/code>, can be taken again by the thread already holding it.\u003c/p>\u003cp>A mutex works only inside one process. It does nothing for two server instances, so rules across instances belong in the database or another shared coordinator. In single-threaded \u003ca href=\"#Async-await\" data-term=\"Async-await\">async-await\u003c/a> code, an async mutex can protect a sequence that spans an \u003ccode>await\u003c/code>.\u003c/p>","avoid":"","usage":["Latency goes up with traffic, but the CPU's only at 20%.","Check the mutex around the cache. It's held during a network call, so every request queues behind it."],"out":[36,41,43,40]},{"name":"Deadlock","section":3,"description":"A state where tasks wait on each other in a cycle, so none can proceed and the affected work hangs indefinitely.","body":"\u003cp>A deadlock is a state in which two or more tasks each wait for something another holds, so none of them can ever proceed. The typical symptom is a service that stops responding with low CPU and no error in the logs, because nothing has failed.\u003c/p>\u003cp>The simplest case involves two locks:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Task A\u003c/th>\u003cth>Task B\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Locks \u003ccode>accounts\u003c/code>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003c/td>\u003ctd>Locks \u003ccode>orders\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Waits for \u003ccode>orders\u003c/code>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003c/td>\u003ctd>Waits for \u003ccode>accounts\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A deadlock requires four conditions at once, known as the Coffman conditions, and removing any one prevents it:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Condition\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>How to break it\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Mutual exclusion\u003c/td>\u003ctd>A resource has one holder at a time\u003c/td>\u003ctd>Use lock-free or immutable data\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hold and wait\u003c/td>\u003ctd>A task holds one resource, requests more\u003c/td>\u003ctd>Acquire everything at once\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No preemption\u003c/td>\u003ctd>A resource cannot be taken away\u003c/td>\u003ctd>Use lock timeouts and back off\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Circular wait\u003c/td>\u003ctd>Tasks wait in a cycle\u003c/td>\u003ctd>Always acquire in one global order\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Consistent ordering is the usual fix. If every code path takes a \u003ca href=\"#Mutex\" data-term=\"Mutex\">mutex\u003c/a> on the lower account ID first, a transfer from A to B and one from B to A cannot form a cycle.\u003c/p>\u003cp>Deadlocks also occur without explicit locks. A \u003ca href=\"#Thread%20pool\" data-term=\"Thread pool\">thread pool\u003c/a> deadlocks when every \u003ca href=\"#Thread\" data-term=\"Thread\">thread\u003c/a> in it waits for subtasks queued in that same pool. A request holding one database connection while waiting for a second can deadlock a small connection pool under load. Calling \u003ccode>.Result\u003c/code> on a task in some C# contexts blocks the thread that the task needs in order to finish.\u003c/p>\u003cp>To diagnose one, take a thread dump and look for tasks waiting on each other. Relational databases detect lock cycles and abort one transaction, so applications should retry that error. Timeouts turn an indefinite hang into a visible failure.\u003c/p>","avoid":"","usage":["Transfers hang now and then, always between the same two accounts.","Opposite transfers lock in opposite order, so it's a deadlock. Always lock the lower account ID first."],"out":[42,37,36]},{"name":"Background job","section":4,"description":"Work moved outside the request-response path so it can run later, retry on failure and not keep the user waiting.","body":"\u003cp>A background job is a unit of work that runs outside the \u003ca href=\"#Request%20lifecycle\" data-term=\"Request lifecycle\">request lifecycle\u003c/a>. The handler records that the work must happen, responds to the user and leaves execution to another process. Sending email, generating reports, resizing images and syncing with third parties are typical cases.\u003c/p>\u003cp>The symptom that calls for one is a request doing too much. Signup takes eight seconds because it calls an email provider, and when that provider has an outage, signups start failing even though the account could have been created. Moving the email to a job keeps the endpoint fast and isolates the failure.\u003c/p>\u003cp>Jobs are usually placed on a \u003ca href=\"#Job%20queue\" data-term=\"Job queue\">job queue\u003c/a> and executed by a \u003ca href=\"#Worker\" data-term=\"Worker\">worker\u003c/a>. If the client needs the outcome, the API can return \u003ccode>202 Accepted\u003c/code> with a job ID to check, or notify it through a \u003ca href=\"#Webhook\" data-term=\"Webhook\">webhook\u003c/a> or \u003ca href=\"#Server-Sent%20Events\" data-term=\"Server-Sent Events\">Server-Sent Events\u003c/a>.\u003c/p>\u003cp>Job code needs different habits from request code:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Rule\u003c/th>\u003cth>Reason\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Make it idempotent\u003c/td>\u003ctd>Most queues can deliver a job more than once\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pass IDs, not whole objects\u003c/td>\u003ctd>Data may have changed by the time the job runs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Set a timeout\u003c/td>\u003ctd>A hung job holds a worker indefinitely\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Keep the payload compatible\u003c/td>\u003ctd>Old jobs may run after new code deploys\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Recheck permissions and state\u003c/td>\u003ctd>The user may have been removed or the order cancelled\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Timing against the database transaction causes a frequent bug. If you enqueue before the commit, a worker may start immediately, fail to find the row and report &quot;record not found&quot;. If you commit and then crash before enqueueing, the job is lost. A transactional outbox solves both: write the job to a table in the same transaction as the data, and have a separate process publish it.\u003c/p>","avoid":"","usage":["Checkout is slow because we generate the PDF receipt in the handler.","Make it a background job. Return the order now and email the receipt when it's ready."],"out":[3,45,46,20,8]},{"name":"Job queue","section":4,"description":"A durable list of pending background jobs that producers add to and workers take from, with retries and failure handling.","body":"\u003cp>A job queue is a store of pending \u003ca href=\"#Background%20job\" data-term=\"Background job\">background jobs\u003c/a>. Application code adds jobs, and \u003ca href=\"#Worker\" data-term=\"Worker\">workers\u003c/a> take them and run them. The queue separates when work is requested from when it is done, so traffic bursts build up as a backlog instead of overloading the system. Sidekiq, BullMQ and Celery are examples.\u003c/p>\u003cp>A job moves through a lifecycle:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Who\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>App\u003c/td>\u003ctd>Enqueues a job with its type and arguments\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Worker\u003c/td>\u003ctd>Reserves it, making it invisible to others for a lease period\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Worker\u003c/td>\u003ctd>Runs the job\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Worker\u003c/td>\u003ctd>Acknowledges success, and the queue removes it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Queue\u003c/td>\u003ctd>On failure or expired lease, makes it available for retry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Queue\u003c/td>\u003ctd>After too many attempts, moves it to a dead-letter queue\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Most queues provide at-least-once delivery. If a worker finishes a job and crashes before acknowledging it, the job runs again. A lease that is shorter than the job's run time causes the same effect while the first worker is still going: two workers process one job and customers receive duplicate emails. Set the lease above the expected duration or extend it while running, and make jobs idempotent.\u003c/p>\u003cp>Retries need delays. Immediate retries against a struggling dependency add load, so use exponential backoff (doubling the wait) with random jitter. Cap the attempts so a poison job, one that can never succeed, does not loop forever. The dead-letter queue holds such jobs for inspection and needs an alert, or failures accumulate unseen.\u003c/p>\u003cp>Monitor the age of the oldest job in addition to queue length. A thousand jobs may be fine for one queue, while a five-minute delay on password-reset emails is an incident. Separate queues by urgency so a large bulk import cannot delay time-sensitive work.\u003c/p>","avoid":"","usage":["Password reset emails are arriving forty minutes late.","The marketing send filled the job queue. Put transactional email on its own queue with dedicated workers."],"out":[44,46]},{"name":"Worker","section":4,"description":"A long-running process that takes jobs from a queue and executes them, separately from the processes serving web requests.","body":"\u003cp>A worker is a long-running process that repeatedly takes a \u003ca href=\"#Background%20job\" data-term=\"Background job\">background job\u003c/a> from a \u003ca href=\"#Job%20queue\" data-term=\"Job queue\">job queue\u003c/a>, runs it and reports the result. Workers usually share the application's codebase but run as separate processes from the web servers, so heavy jobs do not take capacity from user requests and each side can scale independently.\u003c/p>\u003cp>A worker has its own \u003ca href=\"#Concurrency\" data-term=\"Concurrency\">concurrency\u003c/a> setting, the number of jobs it runs at once. The right value depends on the work:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Job type\u003c/th>\u003cth>Suggested setup\u003c/th>\u003cth>Reason\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>CPU-heavy\u003c/td>\u003ctd>About one job per core\u003c/td>\u003ctd>More only adds switching\u003c/td>\u003c/tr>\u003ctr>\u003ctd>I/O-heavy\u003c/td>\u003ctd>Higher concurrency\u003c/td>\u003ctd>Jobs mostly wait\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Memory-heavy\u003c/td>\u003ctd>Low concurrency, dedicated workers\u003c/td>\u003ctd>Prevents out-of-memory kills\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rate-limited API\u003c/td>\u003ctd>A limit shared across workers\u003c/td>\u003ctd>Per-process limits add up\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Adding workers is not always safe. Each one opens connections, so doubling the count can exhaust the database's connection limit and turn a slow backlog into errors for the web application too. Check downstream capacity before scaling, and scale on queue age or depth instead of CPU when jobs mostly wait.\u003c/p>\u003cp>Prefetching causes another surprise. Some systems let a worker reserve several jobs in advance. A worker holding a batch while stuck on one long job leaves the others waiting even though other workers are idle. Lower the prefetch setting for long-running jobs.\u003c/p>\u003cp>Deploys need care because old and new code run at the same time. A new web server can enqueue a job in a format an old worker cannot read, so deploy changes to job payloads in compatible steps. Workers also need \u003ca href=\"#Graceful%20shutdown\" data-term=\"Graceful shutdown\">graceful shutdown\u003c/a>: on a stop signal, stop taking new jobs and finish or release current ones.\u003c/p>","avoid":"","usage":["We added ten workers to clear the backlog and now the API is throwing connection errors.","Each worker holds its own connections, so we've hit the database limit. Scale back and lower their concurrency."],"out":[44,45,34,48]},{"name":"Cron job","section":4,"description":"A task that runs automatically on a time-based schedule, such as every night at 2 a.m.","body":"\u003cp>A cron job is a task run automatically on a recurring schedule. The name comes from \u003ccode>cron\u003c/code>, the Unix scheduler, whose five-field expression is now used by many other schedulers. Nightly reports, cleanup of expired data and monthly invoicing are typical uses.\u003c/p>\u003cpre>\u003ccode>0 2 * * 1-5   run at 02:00, Monday to Friday\u003c/code>\u003c/pre>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Field\u003c/th>\u003cth>Allowed values\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Minute\u003c/td>\u003ctd>0-59\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hour\u003c/td>\u003ctd>0-23\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Day of month\u003c/td>\u003ctd>1-31\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Month\u003c/td>\u003ctd>1-12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Day of week\u003c/td>\u003ctd>0-7 (0 and 7 are Sunday)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>If both day fields are restricted, standard cron runs when either matches, so \u003ccode>0 0 13 * 5\u003c/code> fires on every 13th and on every Friday.\u003c/p>\u003cp>Most cron problems come from assumptions about how a run behaves:\u003c/p>\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Problem\u003c/th>\u003cth>Symptom\u003c/th>\u003cth>What to do\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Runs per instance\u003c/td>\u003ctd>Scaling to three servers sends three invoices\u003c/td>\u003ctd>Use one scheduler, or take a shared lock\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Overlapping runs\u003c/td>\u003ctd>A slow job is still going when the next starts\u003c/td>\u003ctd>Skip the run if the last is still active\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Daylight saving\u003c/td>\u003ctd>A 02:30 job is skipped or runs twice\u003c/td>\u003ctd>Schedule in UTC\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Missed runs\u003c/td>\u003ctd>The host was down at 02:00, so nothing ran\u003c/td>\u003ctd>Process &quot;everything due&quot; instead of &quot;today&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Silent failure\u003c/td>\u003ctd>B
